gave him a hard biscuit from my drawer and told him to go back to the boardinghouse."},{"kind":"beat","text":"She touches her collar, her fingers suddenly tight."},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"I did not do him an injury, Officer. I followed the district regulations."},{"id":"teacher_boy_turned_away","kind":"notebook","text":"Schoolteacher turned away Naomi's son for lack of county residence proof: 'I followed the district regulations.'"},{"id":"boy_district_refusal","kind":"evidence"}]}]}],"tag":"teacher_boy","timing":"6"},{"gate":{"left":{"args":["curriculum_abridgment"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["schoolteacher","reader_letter"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(curriculum_abridgment) AND NOT topic_done(schoolteacher, reader_letter)","id":"reader_letter","label":"Ask for the covering letter Abernathy mentioned","line":70,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Mr. Abernathy says he prepared the reader's abridgment. He says you received a covering letter."},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"He told you that himself?"},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"He wanted me to distinguish his decision from yours."},{"kind":"beat","text":"She unlocks the shallow drawer beneath her desk."},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"Then you may distinguish them accurately."},{"kind":"line","player":false,"speaker":"THE COVERING LETTER","text":"Retain the subscriptions toward rebuilding. Omit the accompanying crew list from the school edition. Approved by the committee. A. Abernathy."},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"You may copy it. The original stays with the readers."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And the things that aren't in the reader?"},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"Ask me what I saw, Officer. I can answer for that."},{"id":"reader_letter","kind":"notebook","text":"Examined Hallowell's covering letter: retain rebuilding subscriptions and omit the crew list from the school edition; committee approval recorded above Abernathy's name. Original remains at the school. This corroborates his account of the abridgment."},{"id":"reader_omission_letter","kind":"evidence"}],"tag":"teacher_reader_letter","timing":"5"},{"gate":{"left":{"left":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["reader_omission_letter"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"not"}},"op":"and","right":{"expr":{"args":["schoolteacher","personal_questions"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(naomi) AND NOT evidence(reader_omission_letter) AND NOT topic_done(schoolteacher, personal_questions)","id":"personal_questions","label":"Ask whether she remembers Naomi's boy","line":87,"steps":[{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"I will answer questions about the school, Officer. I will not furnish an account of the town for the museum to contradict tomorrow."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What has the museum to do with a child at your gate?"},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"Mr. Abernathy supplies the history we are expected to teach. You might begin by asking him what he left out."},{"id":"teacher_refusal","kind":"notebook","text":"Hallowell declined a personal account and referred Walter to Abernathy about omissions in the history taught at the school."}],"tag":"teacher_personal_refusal","timing":"2"}]},"sebastian_wick":{"color":"#d35400","label":"Mr. Wick (Atty.)","location":"upper_residential_ridge","schedule":{"dawn":"{veranda}","evening":"{club_carriage_stop}","midday":"{study}"},"source":"dialogue/mr_wick.dialogue","topics":[{"gate":{"expr":{"args":["sebastian_wick","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(sebastian_wick, default)","id":"default","label":"","line":8,"steps":[{"kind":"line","player":false,"speaker":"MR. WICK","text":"You are either here officially or personally."},{"kind":"line","player":false,"speaker":"MR. WICK","text":"The distinction matters more than most officers realize."}],"tag":"","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"records","label":"Ask about missing records","line":13,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"How does a document disappear?"},{"kind":"line","player":false,"speaker":"MR. WICK","text":"Usually without disappearing at all."},{"kind":"line","player":false,"speaker":"MR. WICK","text":"A filing decision here. A transfer there."},{"kind":"line","player":false,"speaker":"MR. WICK","text":"Eventually everyone involved can justify his own part in the loss."}],"tag":"wick_records","timing":""},{"gate":{"args":["lay_lead"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(lay_lead)","id":"claim","label":"Ask about an old wage claim","line":22,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Can a century-old debt still exist?"},{"kind":"line","player":false,"speaker":"MR. WICK","text":"Exist? Certainly."},{"kind":"line","player":false,"speaker":"MR. WICK","text":"Be collected? That depends which family owes it."},{"id":"wick_claim_1","kind":"notebook","text":"Legal existence and practical enforceability are separate questions."},{"id":"legal_claim","kind":"evidence"}],"tag":"wick_claim","timing":""},{"gate":{"left":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"op":"and","right":{"expr":{"args":["sebastian_wick","filing"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"coat = plain AND NOT topic_done(sebastian_wick, filing)","id":"filing","label":"Ask what he would do","line":32,"steps":[{"kind":"line","player":false,"speaker":"MR. WICK","text":"If I wished something buried, I would not destroy it."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What would you do?"},{"kind":"line","player":false,"speaker":"MR. WICK","text":"I would ensure every surviving copy was perfectly filed."}],"tag":"wick_plain","timing":""}]},"stationer":{"color":"#27ae60","label":"Mr. Finch (Stationer)","location":"business_district","schedule":{"evening":"stationer","midday":"stationer","morning":"stationer","night":"closed"},"source":"dialogue/stationer.dialogue","topics":[{"gate":{"left":{"expr":{"args":["stationer","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(stationer, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MR. FINCH","text":"Two-cent ruled slates on the counter, linen correspondence paper in the drawers."},{"kind":"beat","text":"He wraps a cake of red sealing wax in brown paper and ties it with a short length of hemp twine."},{"kind":"line","player":false,"speaker":"MR. FINCH","text":"You have ink on your knuckles, friend. Same as any man who spends his evenings arguing with ledgers."}],"tag":"stationer_plain","timing":""},{"gate":{"expr":{"args":["stationer","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(stationer, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MR. FINCH","text":"Officer Corwin. If this is the quarterly precinct supply voucher, Odell hasn't endorsed it."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I'm not here for blotters, Mr. Finch."},{"kind":"line","player":false,"speaker":"MR. FINCH","text":"Then I hope you're here as a paying customer.\nA shop runs on sales, Officer, not on town curiosity."}],"tag":"stationer_badge","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"the_corkboard_twine","label":"Ask about heavy wrapping twine and map pins","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I need another spool of the tarred hemp twine. And brass-headed pins."},{"kind":"line","player":false,"speaker":"MR. FINCH","text":"Working late in your room above the cobbler again, are you?"},{"kind":"beat","text":"He sets a wooden bobbin of dark twine on the counter."},{"kind":"line","player":false,"speaker":"MR. FINCH","text":"Most men who buy that twine use it to hang dried cod in the shed.\nYou're the only man in this county who strings it between index cards."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"It keeps the facts from drifting."},{"kind":"line","player":false,"speaker":"MR. FINCH","text":"Facts don't drift, Walter. Men do.\nWhen my ledger shows an inventory deficit, I don't string twine across the shelves. I look at who holds the key."},{"id":"stationer_twine_1","kind":"notebook","text":"Mr. Finch: 'Facts don't drift, Walter. Men do.' Observed that only Walter uses merchant twine to bind cards."}],"tag":"stationer_twine","timing":"5"},{"gate":{"args":["knife"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(knife)","id":"fenn_orders","label":"Ask about Dr. Fenn's stationery orders","line":34,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Dr. Aldous Fenn bought his calfskin notebooks here."},{"kind":"line","player":false,"speaker":"MR. FINCH","text":"Heavy imported vellum. Octavo size, marbled endpapers.\nHe insisted on iron-gall ink. Said modern aniline dyes fade inside thirty years, and he intended his observations to outlast the century."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What was he writing?"},{"kind":"line","player":false,"speaker":"MR. FINCH","text":"He didn't share his notes with a tradesman, Officer.\nThough he did buy two dozen wax candles every autumn. The thick spermaceti ones that burn without smoke in closed cellars."},{"id":"stationer_fenn_supplies","kind":"notebook","text":"Dr. Fenn purchased iron-gall ink and heavy smokeless spermaceti candles for closed-cellar work."},{"id":"cellar_candles","kind":"evidence"}],"tag":"stationer_parchment","timing":"4"},{"gate":{"left":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["stationer","naomi_supplies"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(naomi) AND NOT topic_done(stationer, naomi_supplies)","id":"naomi_supplies","label":"Ask if Naomi Freeman purchased writing materials","line":46,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did Naomi Freeman come into the shop before she died?"},{"kind":"line","player":false,"speaker":"MR. FINCH","text":"The colored woman staying at Mrs. Almy's? She came in on a Thursday."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What did she buy?"},{"kind":"line","player":false,"speaker":"MR. FINCH","text":"A one-cent graphite pencil. And two sheets of heavy draughting linen.\nShe asked if linen would rot if kept in oilskin near salt water. I told her linen outlasts paper three to one in the damp."},{"kind":"beat","text":"He pauses, resting both palms on the polished counter."},{"kind":"line","player":false,"speaker":"MR. FINCH","text":"She wasn't writing a letter, Walter. She was copying a diagram.\nShe asked if I carried red transfer wax to take an impression of an engraved brass maker's plate.\nSaid she needed to lift the serial mark off an old boiler without damaging the patina."},{"id":"stationer_naomi_linen","kind":"notebook","text":"Naomi Freeman bought drafting linen and asked for transfer wax to take an impression of an engraved brass plate on an old boiler without damaging patina."},{"id":"drafting_linen_diagram","kind":"evidence"}],"tag":"stationer_naomi","timing":"5"},{"gate":{"left":{"args":["local_historian","crew_omission_official"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["stationer","crew_omission"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"topic_done(local_historian, crew_omission_official) AND NOT topic_done(stationer, crew_omission)","id":"crew_omission","label":"Ask why the town's history leaves out the crew's names","line":61,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Why does the town's history leave out the crew's names?"},{"kind":"line","player":false,"speaker":"MR. FINCH","text":"I sell the school reader as it comes from the printer."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"No one asked why it names the benefactors and not the crew?"},{"kind":"line","player":false,"speaker":"MR. FINCH","text":"No one asked me. If you want the wording changed, you need someone other than a stationer."},{"id":"crew_omission_refusal","kind":"notebook","text":"Asked Mr. Finch why the crew's names are missing from the town's history. No explanation supplied; the question remains open."}],"tag":"stationer_crew_omission","timing":"3"}]},"steward":{"color":"#c0392b","label":"Club Steward","location":"lounge","schedule":{},"source":"dialogue/steward.dialogue","topics":[{"gate":{"left":{"args":[],"call":false,"cmp":"","name":"steward_ready","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["steward","steward_open"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"steward_ready AND NOT topic_done(steward, steward_open)","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"THE CLUB'S STEWARD","text":"He sets down the glass he was drying.\n\nNot used to seeing you without the badge, Officer."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I'm not asking as the badge today."},{"kind":"line","player":false,"speaker":"THE CLUB'S STEWARD","text":"Didn't figure you were.\n\nAsk, then. I'll keep drying these."}],"tag":"steward_open","timing":""},{"gate":{"left":{"args":[],"call":false,"cmp":"=","name":"day","op":"cmp","value":"3"},"op":"and","right":{"args":[],"call":false,"cmp":"!=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"day = 3 AND coat != plain","id":"default","label":"","line":12,"steps":[{"kind":"line","player":false,"speaker":"THE STEWARD","text":"I asked you to leave your badge behind."}],"tag":"steward_badge","timing":""},{"gate":{"left":{"args":[],"call":false,"cmp":"\u003c","name":"day","op":"cmp","value":"3"},"op":"and","right":{"args":["service_work"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"gate_src":"day \u003c 3 AND evidence(service_work)","id":"default","label":"","line":17,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Mrs. Almy says a woman came around asking about work here. Cleaning, laundry, anything she could carry home."},{"kind":"line","player":false,"speaker":"THE STEWARD","text":"I heard the same, secondhand. Never caught a name.\n\nColored woman, I was told. That's the whole of what reached me."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Who would have taken her name down, if anyone did?"},{"kind":"line","player":false,"speaker":"THE STEWARD","text":"If a name was taken, it would be in the staff day book. The dining-room list is no use to you.\n\nNot now, Officer. I have the room to put in order."},{"id":"steward_first_lead_1","kind":"notebook","text":"The steward heard secondhand that a colored woman had asked about work at the estate; he never caught a name and won't say who told him."},{"id":"steward_heard_secondhand","kind":"evidence"}],"tag":"steward_first_lead","timing":"4"},{"gate":{"args":[],"call":false,"cmp":"\u003c","name":"day","op":"cmp","value":"3"},"gate_src":"day \u003c 3","id":"default","label":"","line":28,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I need to ask about the people who came through the service entrance."},{"kind":"line","player":false,"speaker":"THE STEWARD","text":"Then ask for the day book. The seating list is for the dining room. It won't tell you who came to work."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"May I see the day book?"},{"kind":"line","player":false,"speaker":"THE STEWARD","text":"Not while I'm putting this room in order, Officer. Come back another day."},{"id":"first_day_book","kind":"notebook","text":"The steward distinguishes the staff day book from the dining-room seating list. He has not produced it. Ask for the day book on returning."}],"tag":"steward_first","timing":""},{"gate":{"left":{"left":{"args":[],"call":false,"cmp":"","name":"steward_ready","op":"cmp","value":null},"op":"and","right":{"args":["service_work"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"op":"and","right":{"expr":{"args":["steward","day_book"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"steward_ready AND evidence(service_work) AND NOT topic_done(steward, day_book)","id":"day_book","label":"Ask for the staff day book he mentioned","line":37,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"You said the staff had a separate book. Mrs. Almy remembers Naomi asking for work here."},{"kind":"beat","text":"The steward takes a narrow ruled book from beneath the sideboard."},{"kind":"line","player":false,"speaker":"THE DAY BOOK","text":"N. FREEMAN — DAY WORK — KITCHEN WING."},{"kind":"line","player":false,"speaker":"THE STEWARD","text":"That is the entry. Copy it as it stands. I did not write her full name."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Who can identify her?"},{"kind":"line","player":false,"speaker":"THE STEWARD","text":"The woman at the boardinghouse knew her. You have already spoken to her."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And the seventh place setting? You always laid seven chairs for six men."},{"kind":"beat","text":"The steward wipes the rim of an empty wine goblet with slow, circular strokes."},{"kind":"line","player":false,"speaker":"THE STEWARD","text":"Standing instruction from Judge Wexford. Fork to the right, knife edge turned outward.\nOld whaler's custom for a man lost at sea whose body never came home."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"They were setting a plate for a drowned man?"},{"kind":"line","player":false,"speaker":"THE STEWARD","text":"They were setting a plate for whoever was willing to sit in the chair, Officer.\nToward the end, nobody asked who it was."},{"id":"day_book_entry","kind":"notebook","text":"Staff day book records 'N. Freeman — Day Work — Kitchen Wing.' Steward revealed the seventh place setting was laid with inverted cutlery—an old whaler's table setting for unrecovered drowned dead."},{"id":"estate_day_book","kind":"evidence"}],"tag":"steward_day_book","timing":"4"},{"gate":{"args":[],"call":false,"cmp":"","name":"steward_ready","op":"cmp","value":null},"gate_src":"steward_ready","id":"club_talk","label":"Ask what the members used to talk about","line":56,"steps":[{"kind":"line","player":false,"speaker":"THE SMOKING LOUNGE","text":"The steward sets a glass on the sideboard. Walter asks about the conversations he used to overhear while serving the members."},{"kind":"line","player":false,"speaker":"THE STEWARD","text":"They stopped speaking of power, toward the end.\n\nStarted speaking, tenderly, of her."},{"id":"","kind":"notebook","text":"Toward the end of what, he doesn't say.\nHer, he doesn't explain.\n\nWalter writes both down exactly as given."},{"id":"club_talk","kind":"evidence"}],"tag":"club_talk","timing":"4"},{"gate":{"left":{"args":[],"call":false,"cmp":"","name":"steward_ready","op":"cmp","value":null},"op":"and","right":{"args":["club_talk"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"gate_src":"steward_ready AND evidence(club_talk)","id":"club_devotion","label":"Ask what Kessler used to say","line":66,"steps":[{"kind":"line","player":false,"speaker":"THE STEWARD","text":"Kessler said it more than once. She'll have us home.\n\nSaid she's no different from any mother."},{"id":"","kind":"notebook","text":"A butcher, a judge, a doctor, a district attorney, a man of property, all of them speaking the same sentence about the same absent woman.\n\nNone of them ever named her."},{"id":"club_devotion","kind":"evidence"}],"tag":"club_devotion","timing":"4"},{"gate":{"left":{"args":[],"call":false,"cmp":"","name":"steward_ready","op":"cmp","value":null},"op":"and","right":{"args":["club_devotion"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"gate_src":"steward_ready AND evidence(club_devotion)","id":"pantry_lead","label":"Ask about the old pantry door","line":75,"steps":[{"kind":"line","player":false,"speaker":"THE STEWARD","text":"There's gin left from before the war. Behind the old pantry door.\n\nThey boarded it up during a renovation and never finished unboarding it. Nobody goes back there. Nobody's gone back there in years."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Will you show me?"},{"kind":"line","player":false,"speaker":"THE STEWARD","text":"No."},{"id":"","kind":"notebook","text":"He won't say why. He also won't take back the direction he just gave.\n\nThe kitchen wing. The old pantry."},{"id":"pantry_lead","kind":"evidence"}],"tag":"pantry_lead","timing":"5"}]},"tailor":{"color":"#27ae60","label":"Mr. Krebs (Tailor)","location":"business_district","schedule":{"evening":"haberdasher","midday":"haberdasher","morning":"haberdasher","night":"closed"},"source":"dialogue/tailor.dialogue","topics":[{"gate":{"left":{"expr":{"args":["tailor","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(tailor, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MR. KREBS","text":"Good day, sir. If you're looking for overcoat repair, I can take measurements."},{"kind":"beat","text":"He glances down at Walter's secondhand boots."},{"kind":"line","player":false,"speaker":"MR. KREBS","text":"Though honest woolen cloth rarely needs the scissors as often as ready-made cotton."}],"tag":"tailor_plain","timing":""},{"gate":{"expr":{"args":["tailor","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(tailor, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MR. KREBS","text":"Officer. If this is about uniform serge, the county contract went to the mill in Lynn."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I'm asking about the evening jackets at the Ophion Club."},{"kind":"line","player":false,"speaker":"MR. KREBS","text":"Ah. The mourning cloths. A dreadful business."}],"tag":"tailor_badge","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"cut_jackets","label":"Ask who ordered the matching club evening dress","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Six men died in identical broadcloth evening coats. Did you cut them?"},{"kind":"line","player":false,"speaker":"MR. KREBS","text":"I cut five, Officer. Italian wool, satin lapels, horn buttons imported through Boston."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Five?"},{"kind":"line","player":false,"speaker":"MR. KREBS","text":"The Judge, Dr. Fenn, Mr. Corliss, Mr. Pruitt, and poor Otto Kessler.\nKessler had to be let out across the shoulder — butcher's bulk, you know. Not a gentleman's posture."},{"id":"tailor_five_1","kind":"notebook","text":"Mr. Krebs tailored five identical club evening coats: Wexford, Fenn, Corliss, Pruitt, and Kessler."},{"id":"five_tailored_coats","kind":"evidence"}],"tag":"tailor_five_jackets","timing":"5"},{"gate":{"op":"lit","value":false},"gate_src":"never","id":"the_sixth_jacket","label":"Ask who made the sixth coat","line":33,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Six bodies lay in the garden. All six wore identical cut coats."},{"kind":"line","player":false,"speaker":"MR. KREBS","text":"Then the sixth was cut by someone who didn't buy his cloth in Miskatonic County."},{"kind":"beat","text":"He fetches an order book, flipping to a marbled ledger page."},{"kind":"line","player":false,"speaker":"MR. KREBS","text":"Look here. Spring commission, 1921. 'Five dress coats, pattern Ophion.'\nI asked Mr. Pruitt if a sixth setting was needed, knowing they kept six chairs."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What did Pruitt answer?"},{"kind":"line","player":false,"speaker":"MR. KREBS","text":"'The sixth coat is already provided,' he told me. Said it had been hanging in the cedar press since his grandfather's winter."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"A coat seventy years old?"},{"kind":"line","player":false,"speaker":"MR. KREBS","text":"Moth-proofed, I expect. Or made of something moths don't eat."},{"id":"tailor_sixth_1","kind":"notebook","text":"Josiah Pruitt told the tailor the sixth club coat was already provided, hanging in cedar since his grandfather's time."},{"id":"ancestral_sixth_coat","kind":"evidence"}],"tag":"tailor_sixth_jacket","timing":"7"},{"gate":{"expr":{"args":["tailor","coat_lining"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(tailor, coat_lining)","id":"coat_lining","label":"Ask what distinguished the Ophion club pattern","line":51,"steps":[{"kind":"line","player":false,"speaker":"MR. KREBS","text":"No label inside the collar. That was Mr. Corliss's instruction.\n'A gentleman's jacket requires no card to say where it came from.'"},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Was there any marking at all?"},{"kind":"line","player":false,"speaker":"MR. KREBS","text":"A black silk cord sewn into the inner breast hem. Shaped like a coiled eel.\nOr a worm. Not decorative. Tucked where only the wearer's hand would brush it when reaching for a pocket."},{"id":"tailor_serpent_hem","kind":"notebook","text":"All club evening jackets contained a black silk cord stitched inside the inner breast hem, shaped like a coiled eel or worm."},{"id":"serpent_hem_motif","kind":"evidence"}],"tag":"tailor_lining","timing":"4"},{"gate":{"left":{"args":["local_historian","crew_omission_official"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["tailor","crew_omission"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"topic_done(local_historian, crew_omission_official) AND NOT topic_done(tailor, crew_omission)","id":"crew_omission","label":"Ask why the town's history leaves out the crew's names","line":64,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Why does the town's history leave out the crew's names?"},{"kind":"line","player":false,"speaker":"MR. KREBS","text":"I remember the subscribers' names from the commemorative dinner. That is all."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And the men who sailed?"},{"kind":"line","player":false,"speaker":"MR. KREBS","text":"I wasn't making their coats, Officer. I have no answer for you."},{"id":"crew_omission_refusal","kind":"notebook","text":"Asked Mr. Krebs why the crew's names are missing from the town's history. No explanation supplied; the question remains open."}],"tag":"tailor_crew_omission","timing":"3"}]},"widow_kessler":{"color":"#2a7050","label":"Widow Kessler","location":"pickman_street","schedule":{"evening":"kessler_parlor","midday":"kessler_shop","morning":"kessler_shop","night":"kessler_parlor"},"source":"dialogue/widow_kessler.dialogue","topics":[{"gate":{"left":{"expr":{"args":["widow_kessler","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(widow_kessler, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"The shop is shut. The ice went yesterday."},{"kind":"beat","text":"She looks past Walter's shoulder toward the street before meeting his eyes."},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"You're not wearing the brass. That's something, at least.\n\nCome inside before the flies find the counter."}],"tag":"kessler_plain","timing":""},{"gate":{"expr":{"args":["widow_kessler","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(widow_kessler, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"Captain Odell already steered me down the steps once this morning, Officer."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I'm not Captain Odell."},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"You wear the same tin on your pocket.\n\nIf you're here to ask what Otto paid to sit with those gentlemen, look at the books yourself. I never saw a penny of it come back."}],"tag":"kessler_badge","timing":""},{"gate":{"args":["knife"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(knife)","id":"the_knife","label":"Ask about Otto's boning knife","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I found a boning knife beneath a hedge root. Wiped clean.\nMaker's stamp matches the blades on your rack."},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"Otto's good knife. Carbon steel. Kept it in grease under the counter."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"It hadn't touched meat."},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"Not hog meat. Not beef.\n\nHe wrapped it in oilcloth three weeks back and put it in his breast pocket like a fountain pen. A butcher carrying his trade into an evening room. He thought that made him their equal."},{"id":"kessler_knife_1","kind":"notebook","text":"Mrs. Kessler confirms the boning knife belonged to Otto. He carried it to the Ophion estate three weeks ago, wrapped in oilcloth."},{"id":"kessler_knife_confirmed","kind":"evidence"}],"tag":"kessler_knife","timing":"4"},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"club_standing","label":"Ask how Otto came to join the club","line":33,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Judge Wexford, Dr. Fenn, Corliss, Pruitt. Men of property.\nHow did Kessler join them?"},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"They needed someone who didn't flinch at gristle."},{"kind":"beat","text":"She wipes an already scrubbed butcher block with a dry rag."},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"Wexford called him 'tradesman' to his face. Corliss wouldn't take a cigar from his case.\nBut on the last Thursday of the month, a carriage came to the alley behind this shop. Not the front door. Never the front."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And he went willingly?"},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"He wore his wedding suit. God forgive him, he thought they were inviting him into the county."},{"id":"kessler_standing_1","kind":"notebook","text":"Otto Kessler was excluded socially by the club's elite members, but collected via carriage at his rear shop entrance every last Thursday."},{"id":"kessler_carriages","kind":"evidence"}],"tag":"kessler_standing","timing":"5"},{"gate":{"args":["kessler_carriages"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(kessler_carriages)","id":"butcher_parcels","label":"Ask what Otto brought to the meetings","line":47,"steps":[{"kind":"fork","options":[{"label":"Ask about meat deliveries.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask about meat deliveries."},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"It wasn't beef he carried in butcher paper. We hadn't slaughtered that morning."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What was it?"},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"Salt. Coarse gray curing salt from the harbor sheds, three pounds at a time, pressed into cakes.\nHe said the kitchen cellar required it dry."},{"id":"kessler_salt_parcels","kind":"notebook","text":"Kessler carried parcels of coarse gray harbor salt to the estate meetings, ostensibly for the kitchen cellar."},{"id":"gray_salt_cakes","kind":"evidence"}]},{"label":"Ask about what he carried away.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask about what he carried away."},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"He came back with empty pockets and dirt under his nails."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Earth?"},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"Wet sand. Sea silt. It smelled like the low-tide flats behind the old try-works.\nI washed his cuffs myself. You don't get that stink from river mud."},{"id":"kessler_silt_cuffs","kind":"notebook","text":"Kessler returned from meetings with sea silt and low-tide try-works stench beneath his nails and cuffs."},{"id":"tryworks_silt","kind":"evidence"}]}]}],"tag":"kessler_parcels","timing":"6"},{"gate":{"left":{"args":["club_devotion"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["widow_kessler","the_mother"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(club_devotion) AND NOT topic_done(widow_kessler, the_mother)","id":"the_mother","label":"Ask how Otto spoke about the club at the end","line":66,"steps":[{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"Toward the end, he stopped bragging about the dinners."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What did he speak about?"},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"'She'll have us home,' he told me. Right there by the stove, taking off his boots."},{"kind":"beat","text":"Her voice drops, thin and unsteady."},{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"'She's no different from any mother,' he said. As if he were comforting a child with a fever.\nI asked him whose mother. He looked at me like he couldn't remember where he'd learned the word."},{"id":"kessler_mother_1","kind":"notebook","text":"Kessler spoke of a maternal power toward the end: 'She'll have us home... She's no different from any mother.'"},{"id":"maternal_delusion","kind":"evidence"}],"tag":"kessler_mother","timing":"5"},{"gate":{"left":{"left":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"op":"and","right":{"left":{"args":["kessler_carriages"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"or","right":{"args":["widow_kessler","club_standing"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null}}},"op":"and","right":{"expr":{"args":["widow_kessler","coat_difference"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"coat = plain AND (evidence(kessler_carriages) OR topic_done(widow_kessler, club_standing)) AND NOT topic_done(widow_kessler, coat_difference)","id":"coat_difference","label":"Ask why she told Walter instead of Odell","line":79,"steps":[{"kind":"line","player":false,"speaker":"MRS. KESSLER","text":"Odell looked at my shop and saw six paragraphs for the Gazette.\nYou came in a coat that smells like damp wool and rain, same as Otto's work coat.\n\nA woman knows when a man is looking for a corpse instead of an excuse."}],"tag":"kessler_coat","timing":""}]}};

const LOCATIONS = {
  "estate":                  { label: "The Estate",        color: "#9a3030" },
  "estate / lounge":         { label: "Estate / Lounge",   color: "#9a3030" },
  "boardinghouse":           { label: "Boardinghouse",     color: "#7a40a0" },
  "town":                    { label: "Town",               color: "#4060a0" },
  "business_district":       { label: "Business District", color: "#2a7050" },
  "town_hall":               { label: "Town Hall",         color: "#2a7050" },
  "post_office":             { label: "Post Office",       color: "#2a7050" },
  "lower_residential":       { label: "Lower Quarter",     color: "#3a5880" },
  "upper_residential_ridge": { label: "Upper Ridge",       color: "#a05830" },
  "upper_residential":       { label: "Upper Residential", color: "#a05830" },
};

// Group by location maintaining order
const LOC_ORDER = ["estate","estate / lounge","boardinghouse","town","business_district","town_hall","post_office","lower_residential","upper_residential_ridge","upper_residential"];
const byLoc = {};
Object.values(NPCS).forEach(npc => { if (!LOC_ORDER.includes(npc.location)) LOC_ORDER.push(npc.location); });
LOC_ORDER.forEach(l => byLoc[l] = []);
Object.entries(NPCS).forEach(([id, npc]) => {
  if (!byLoc[npc.location]) byLoc[npc.location] = [];
  byLoc[npc.location].push(id);
});

let activeNpc = null;

function buildNav(filter = "") {
  const nav = document.getElementById("nav-tree");
  nav.innerHTML = "";
  LOC_ORDER.forEach(loc => {
    const ids = byLoc[loc] || [];
    const filtered = filter ? ids.filter(id => NPCS[id].label.toLowerCase().includes(filter.toLowerCase())) : ids;
    if (!filtered.length) return;
    const locInfo = LOCATIONS[loc] || { label: loc, color: "#888" };
    const grp = document.createElement("div");
    grp.className = "loc-group";
    grp.innerHTML = `<div class="loc-header" onclick="toggleLoc(this)">
      <span>${locInfo.label}</span><span class="arrow">▾</span>
    </div><div class="loc-npcs">` +
      filtered.map(id => {
        const npc = NPCS[id];
        const tc = npc.topics ? npc.topics.length : 0;
        return `<button class="npc-btn${activeNpc===id?' active':''}" onclick="showNpc('${id}')" data-id="${id}">
          <span class="npc-dot" style="background:${npc.color}"></span>
          <span>${npc.label}</span>
          <span class="topic-count">${tc}T</span>
        </button>`;
      }).join("") + `</div>`;
    nav.appendChild(grp);
  });
}

function toggleLoc(el) {
  el.parentElement.classList.toggle("collapsed");
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function walkSteps(steps, fn) {
  for (const step of steps) {
    fn(step);
    if (step.kind === 'fork') for (const option of step.options) walkSteps(option.steps, fn);
  }
}
function renderSteps(steps) {
  return steps.map(step => {
    if (step.kind === 'fork') return `<div class="section-label">Choose one response · continuation resumes afterward</div>` + step.options.map((option, i) => `<details style="margin:8px 0 8px 16px;border-left:2px solid var(--fork-color);padding-left:12px"><summary>${i+1}. ${escapeHtml(option.label)}</summary>${renderSteps(option.steps)}</details>`).join('');
    if (step.kind === 'evidence') return `<div class="ev-label">Record evidence: <code>${escapeHtml(step.id)}</code></div>`;
    if (step.kind === 'notebook') return `<p><strong>NOTEBOOK ${escapeHtml(step.id || '(text-derived ID)')}</strong><br>${escapeHtml(step.text).replace(/\n/g,'<br>')}</p>`;
    if (step.kind === 'beat') return `<p><em>[${escapeHtml(step.text)}]</em></p>`;
    return `<p><strong>${escapeHtml(step.speaker)}</strong><br>${escapeHtml(step.text).replace(/\n/g,'<br>')}</p>`;
  }).join('');
}
function showNpc(id) {
  activeNpc = id;
  buildNav(document.getElementById('search').value);
  const npc = NPCS[id], topics = npc.topics;
  const evidence = new Set(); let forks = 0;
  topics.forEach(t => walkSteps(t.steps, s => { if(s.kind==='evidence') evidence.add(s.id); if(s.kind==='fork') forks++; }));
  const detail = document.getElementById('npc-detail');
  detail.innerHTML = `<div class="npc-header"><div class="npc-color-bar" style="background:${npc.color}"></div><div><div class="npc-title">${escapeHtml(npc.label)}</div><div class="npc-meta">Authored location: ${escapeHtml(npc.location)}</div><div class="npc-id">NPC: ${escapeHtml(id)} · Source: ${escapeHtml(npc.source)}</div></div></div>
    <p style="font-size:.8rem;color:var(--text-muted)">Schedule: ${escapeHtml(Object.entries(npc.schedule).map(([k,v])=>k+'='+v).join(', ') || 'No authored schedule; consult story staging.')}</p>
    <p style="font-size:.8rem;color:var(--text-muted)">Exact source order. The first eligible nonempty default wins. Gates below control topics; world access and actor staging are additional checks. Catalog residents disappear at night; core actors have separate staging.</p>
    <div class="stats-bar"><div class="stat"><span class="stat-n">${topics.length}</span>authored blocks</div><div class="stat"><span class="stat-n">${topics.filter(t=>t.steps.length).length}</span>nonempty blocks</div><div class="stat"><span class="stat-n">${forks}</span>forks</div><div class="stat"><span class="stat-n">${evidence.size}</span>distinct authored evidence IDs, including disabled content</div></div>
    <p style="font-size:.8rem;color:var(--text-muted)">Branch evidence belongs only to its chosen path. Completion does not automatically hide a topic; revisits follow its exact gate. This is a source snapshot, not a live availability simulator.</p>
    <div class="topic-tree">${topics.map((t,i)=>{
      const disabled=t.gate_src.trim().toLowerCase()==='never', stub=!t.steps.length;
      return `<div class="topic-node${disabled||stub?' never':''}"><div class="topic-head" onclick="toggleTopic(this)"><span class="toggle-arrow">▶</span><span class="topic-name">${i+1}. ${escapeHtml(t.label || t.id)}</span><span class="pill ${disabled||stub?'pill-never':'pill-gate'}">${stub?'EMPTY / unavailable':disabled?'NEVER / unavailable':t.id==='default'?'automatic default':'menu topic'}</span></div><div class="topic-body"><p><strong>Exact GATE:</strong> <code>${escapeHtml(t.gate_src)}</code></p><p>ID: <code>${escapeHtml(t.id)}</code> · TAG: <code>${escapeHtml(t.tag || '(none)')}</code> · TIME: ${escapeHtml(t.timing || '(default 3 minutes)')}</p>${renderSteps(t.steps)}</div></div>`;
    }).join('')}</div>`;
  document.getElementById('placeholder').style.display='none';
  detail.style.display='block';
}

function toggleTopic(el) {
  el.classList.toggle("open");
  const body = el.nextElementSibling;
  body.classList.toggle("open");
}

document.getElementById("search").addEventListener("input", e => {
  buildNav(e.target.value);
});

buildNav();
</script>
