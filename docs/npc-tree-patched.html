phion's crew list carries the name Freeman. Were they transients?"},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"Transients? Great heavens, no."},{"kind":"beat","text":"He removes his spectacles, cleaning them with a silk handkerchief."},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"Massachusetts abolished slavery through judicial decree in the 1780s, Officer. Coastal maritime communities had free families of color established for generations before the Ophion ever tasted salt.\nThe Freemans were skilled harpooners and boat-steerers. Their lineage in this commonwealth predates the Pruitt mills by forty years."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Why did the town registry call Naomi a transient?"},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"Because a town registry is written by living clerks to serve living landowners, Officer.\nPaper forgets whatever it is inconvenient to remember."},{"id":"historian_crew_1","kind":"notebook","text":"Historian confirms the Freeman whaling lineage was free by Massachusetts law since 1780s; calls town's 'transient' label a living clerk's convenience."},{"id":"freeman_lineage_free","kind":"evidence"}],"tag":"historian_crew_lineage","timing":"5"},{"gate":{"left":{"left":{"args":["lay_lead"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"or","right":{"args":["sanitized_textbook"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"op":"and","right":{"expr":{"args":["local_historian","crew_omission_official"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"(evidence(lay_lead) OR evidence(sanitized_textbook)) AND NOT topic_done(local_historian, crew_omission_official)","id":"crew_omission_official","label":"Ask why the town's history leaves out the crew's names","line":69,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The town remembers the estates that paid for its recovery. Where are the names of the men who sailed?"},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"A civic history concerns the town's recovery, Officer. A crew list concerns a ship. Different documents serve different purposes."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Who decided which people belonged in which document?"},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"The Society stands by its account. I have nothing to add."},{"id":"crew_official","kind":"notebook","text":"Abernathy defended separating the crew list from the civic history. He would not explain the editorial decision. Other people in town may remember how the account was circulated."}],"tag":"historian_crew_official","timing":"4"},{"gate":{"left":{"left":{"args":["local_historian","crew_omission_official"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"and","right":{"args":["crew_omission"],"call":true,"cmp":">=","name":"topic_count","op":"cmp","value":"4"}},"op":"and","right":{"expr":{"args":["local_historian","crew_omission_followup"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"topic_done(local_historian, crew_omission_official) AND topic_count(crew_omission) >= 4 AND NOT topic_done(local_historian, crew_omission_followup)","id":"crew_omission_followup","label":"Return to the question of the missing crew names","line":80,"steps":[{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"I hear you've been asking why the crew's names are missing."},{"kind":"beat","text":"He closes the museum visitor book."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I have been asking the same question. I haven't had an answer."},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"The question has been repeated to me rather less politely. If the Society is to be accused of an omission, I would prefer it described accurately."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Then describe it."},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"I prepared the abridgment for the school reader. The committee asked for the rebuilding of the town. I retained the subscriptions and left out the crew list."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Your decision?"},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"My pencil, Officer. The committee approved the page. Miss Hallowell received the covering letter with her copies. Ask her for the letter before you assign anyone else's hand to it."},{"id":"reader_source","kind":"notebook","text":"Abernathy says he omitted the crew list when abridging the civic history for the school reader. He says the committee approved it and Hallowell received a covering letter. The letter has not yet been examined."},{"id":"curriculum_abridgment","kind":"evidence"}],"tag":"historian_crew_followup","timing":"6"}]},"miriam_ashcroft":{"color":"#d35400","label":"Mrs. Ashcroft","location":"upper_residential_ridge","schedule":{"dawn":"{garden_walk}","evening":"{sunroom}","midday":"{ashcroft_house}"},"source":"dialogue/mrs_ashcroft.dialogue","topics":[{"gate":{"expr":{"args":["miriam_ashcroft","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(miriam_ashcroft, default)","id":"default","label":"","line":8,"steps":[{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"You have climbed a long way to ask a question, Officer."},{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"People generally come up here to avoid being asked one."}],"tag":"","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"town","label":"Ask about the ridge","line":13,"steps":[{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"The town prefers to imagine the hill means something."},{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"It does not. The rich simply reached the top first and stayed."}],"tag":"ashcroft_town","timing":""},{"gate":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(naomi)","id":"naomi","label":"Ask whether she knew Naomi Freeman","line":20,"steps":[{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"Knew? No."},{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"Saw? Yes."},{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"A woman asking directions to houses that had no intention of answering her."},{"id":"ashcroft_naomi_1","kind":"notebook","text":"Mrs. Ashcroft recalls seeing Naomi Freeman on the ridge, turned away door to door."},{"id":"ridge_sighting","kind":"evidence"}],"tag":"ashcroft_naomi","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"club","label":"Ask about the Ophion Club","line":30,"steps":[{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"Men join clubs to hear themselves echoed."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did your husband belong?"},{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"For eighteen years."},{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"The club improved none of his opinions, but certainly increased his confidence in them."}],"tag":"ashcroft_club","timing":""},{"gate":{"left":{"args":["local_historian","crew_omission_official"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["miriam_ashcroft","crew_omission"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"topic_done(local_historian, crew_omission_official) AND NOT topic_done(miriam_ashcroft, crew_omission)","id":"crew_omission","label":"Ask why the town's history leaves out the crew's names","line":39,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The crew who drowned in 1823. Their names don't appear anywhere."},{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"No."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"You've never wondered why."},{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"I have wondered about a great many things this town has decided not to write down.\nWondering has not changed any of them."},{"kind":"beat","text":"She turns back toward the garden as if the conversation has already concluded."},{"kind":"line","player":false,"speaker":"MRS. ASHCROFT","text":"My husband attended eighteen years of dinners at that club.\nHe came home from each one entirely satisfied.\nI have learned to read satisfaction carefully."},{"id":"ashcroft_crew_omission","kind":"notebook","text":"Mrs. Ashcroft offered no explanation for the crew's absence from the record. She implied her husband's club membership made him comfortable with what was omitted."}],"tag":"mrs_ashcroft_crew_omission","timing":"3"}]},"miss_wexley":{"color":"#d35400","label":"Miss Wexley","location":"upper_residential_ridge","schedule":{"evening":"club_road","midday":"museum_committee","morning":"home","night":"home"},"source":"dialogue/miss_wexley.dialogue","topics":[{"gate":{"left":{"expr":{"args":["miss_wexley","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"!=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(miss_wexley, default) AND coat != plain","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"MISS WEXLEY","text":"Officer."},{"kind":"beat","text":"Miss Wexley smiles with the composed patience of a woman receiving an unavoidable tradesman."},{"kind":"line","player":false,"speaker":"MISS WEXLEY","text":"I should hate to waste your morning with rumor when the town is already overfull of it."}],"tag":"wexley_badge","timing":""},{"gate":{"left":{"expr":{"args":["miss_wexley","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(miss_wexley, default) AND coat = plain","id":"default","label":"","line":12,"steps":[{"kind":"line","player":false,"speaker":"MISS WEXLEY","text":"Mr. Corwin, isn't it?"},{"kind":"beat","text":"Her tone softens once she realizes he has come without the uniform."},{"kind":"line","player":false,"speaker":"MISS WEXLEY","text":"That is better. A man in ordinary wool may still be answered as a neighbor, which is more than can usually be said for an officer."}],"tag":"wexley_plain","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"museum_story","label":"Ask why the museum omits certain families","line":19,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Your museum manages a very clean version of the town."},{"kind":"line","player":false,"speaker":"MISS WEXLEY","text":"A museum manages what can be displayed without becoming an argument."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And what cannot?"},{"kind":"line","player":false,"speaker":"MISS WEXLEY","text":"Lives in ledgers, usually. Or kitchens. Or the sort of conversation people have only when they are unwise enough to feel guilty."},{"id":"wexley_curation","kind":"notebook","text":"Miss Wexley admitted the museum presents only what can be displayed without public argument; the rest remains in ledgers and private talk."},{"id":"curated_history","kind":"evidence"}],"tag":"wexley_museum","timing":"4"},{"gate":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"gate_src":"coat = plain","id":"freeman_claim","label":"Ask whether she has heard of the Freeman wage claim","line":31,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did you ever hear the name Freeman attached to an unpaid lay?"},{"kind":"line","player":false,"speaker":"MISS WEXLEY","text":"Yes."},{"kind":"beat","text":"She answers too quickly, then looks past him toward the ridge road."},{"kind":"line","player":false,"speaker":"MISS WEXLEY","text":"Not in committee, of course. In private. As one hears of many things this town prefers to inherit rather than settle."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Who mentioned it?"},{"kind":"line","player":false,"speaker":"MISS WEXLEY","text":"A woman can remain welcome in a drawing room, Officer, or she can become useful to your case. Rarely both."},{"id":"wexley_freeman","kind":"notebook","text":"Miss Wexley recognized the Freeman wage claim and implied it was privately known among upper families, though never discussed in committee."},{"id":"freeman_whisper","kind":"evidence"}],"tag":"wexley_claim","timing":"5"},{"gate":{"left":{"args":["local_historian","crew_omission_official"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["miss_wexley","crew_omission"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"topic_done(local_historian, crew_omission_official) AND NOT topic_done(miss_wexley, crew_omission)","id":"crew_omission","label":"Ask why the town's history leaves out the crew's names","line":45,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Why does the town's history leave out the crew's names?"},{"kind":"line","player":false,"speaker":"MISS WEXLEY","text":"A memorial cannot be expected to reproduce every ledger."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"It found room for the families who received the money."},{"kind":"line","player":false,"speaker":"MISS WEXLEY","text":"I shall not discuss the Society's editorial decisions on a doorstep. Mr. Abernathy has an office for that."},{"id":"crew_omission_refusal","kind":"notebook","text":"Asked Miss Wexley why the crew's names are missing from the town's history. No explanation supplied; the question remains open."}],"tag":"miss_wexley_crew_omission","timing":"3"}]},"mr_whitehouse":{"color":"#d35400","label":"Mr. Whitehouse","location":"upper_residential_ridge","schedule":{"evening":"home","midday":"business_district","morning":"bank_walk","night":"home"},"source":"dialogue/mr_whitehouse.dialogue","topics":[{"gate":{"expr":{"args":["mr_whitehouse","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(mr_whitehouse, default)","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"MR. WHITEHOUSE","text":"Corwin."},{"kind":"beat","text":"Mr. Whitehouse folds a newspaper against his cane with slow, practiced precision."},{"kind":"line","player":false,"speaker":"MR. WHITEHOUSE","text":"If this is about the dead men, I advise you to distinguish inconvenience from catastrophe while the town still can."}],"tag":"whitehouse_default","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"subscriptions_and_credit","label":"Ask why everyone keeps calling it arithmetic","line":12,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Every man I speak to gives me a different version of the same excuse."},{"kind":"line","player":false,"speaker":"MR. WHITEHOUSE","text":"Then you are hearing the truth from several angles at once."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Truth."},{"kind":"line","player":false,"speaker":"MR. WHITEHOUSE","text":"Yes. Mills extend credit. Papers carry advertisers. Banks calm depositors. Houses keep staff employed. Remove confidence from a town this size and the rest follows it into the water."},{"id":"whitehouse_confidence","kind":"notebook","text":"Whitehouse described the town's silence as a defense of confidence: banks, papers, houses, and wages depend on keeping panic out of print."},{"id":"civic_arithmetic","kind":"evidence"}],"tag":"whitehouse_credit","timing":"4"},{"gate":{"args":["civic_arithmetic"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(civic_arithmetic)","id":"name_the_dead","label":"Ask whether confidence matters more than the dead","line":24,"steps":[{"kind":"fork","options":[{"label":"Say that eight people died, not six.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Say that eight people died, not six."},{"kind":"line","player":false,"speaker":"MR. WHITEHOUSE","text":"And if you print eight, do they revive?"},{"kind":"line","player":false,"speaker":"MR. WHITEHOUSE","text":"No. But the bank run becomes real, the paper goes under, and every laundress and porter paid from those accounts discovers that your honesty has a payroll attached to it."},{"id":"whitehouse_eight_payroll","kind":"notebook","text":"Whitehouse argued that acknowledging all eight dead would trigger wider economic harm the town's laboring people would bear."}]},{"label":"Say that silence is still a choice.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Say that silence is still a choice."},{"kind":"line","player":false,"speaker":"MR. WHITEHOUSE","text":"Of course it is."},{"kind":"beat","text":"He taps the folded newspaper once against his glove."},{"kind":"line","player":false,"speaker":"MR. WHITEHOUSE","text":"Adulthood consists largely of choosing which damage will be entered into the record and which will merely be survived."},{"id":"whitehouse_silence_choice","kind":"notebook","text":"Whitehouse openly described public silence as a deliberate civic choice, not an accident."},{"id":"silence_is_choice","kind":"evidence"}]}]}],"tag":"whitehouse_dead","timing":"6"}]},"mrs_pell":{"color":"#d35400","label":"Mrs. Pell","location":"upper_residential_ridge","schedule":{"evening":"home","midday":"club_road","morning":"home","night":"home"},"source":"dialogue/mrs_pell.dialogue","topics":[{"gate":{"left":{"expr":{"args":["mrs_pell","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(mrs_pell, default) AND coat = plain","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"MRS. PELL","text":"You are not calling in any official capacity, then."},{"kind":"beat","text":"Mrs. Pell keeps one gloved hand on the gate latch, studying Walter's coat before she studies his face."},{"kind":"line","player":false,"speaker":"MRS. PELL","text":"That is almost a relief. Men with badges always arrive having already decided what sort of answer they mean to hear."}],"tag":"pell_plain","timing":""},{"gate":{"left":{"expr":{"args":["mrs_pell","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"!=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(mrs_pell, default) AND coat != plain","id":"default","label":"","line":12,"steps":[{"kind":"line","player":false,"speaker":"MRS. PELL","text":"Officer Corwin."},{"kind":"beat","text":"Her expression does not change; only the gate remains half-closed."},{"kind":"line","player":false,"speaker":"MRS. PELL","text":"If this concerns the club, I imagine Captain Odell has already received whatever statement the town requires of me."}],"tag":"pell_badge","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"club_guests","label":"Ask who visited the ridge after dark","line":19,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"There were carriages on this road after midnight."},{"kind":"line","player":false,"speaker":"MRS. PELL","text":"There are always carriages on this road after midnight. That is half the point of having a ridge to climb to."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I only need to know whose."},{"kind":"line","player":false,"speaker":"MRS. PELL","text":"No, Officer. You need a world in which the right names make the wrong night simpler. That is not the same thing."},{"id":"pell_ridge_traffic","kind":"notebook","text":"Mrs. Pell would not name late-night visitors to the ridge; she treated such traffic as routine among the upper houses."}],"tag":"pell_guests","timing":"4"},{"gate":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"gate_src":"coat = plain","id":"servant_talk","label":"Ask whether her maid heard anything from the club road","line":30,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Your maid keeps the back rooms facing the club road."},{"kind":"line","player":false,"speaker":"MRS. PELL","text":"She keeps my rooms, Officer. She is not an extension of your precinct."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did she hear anything?"},{"kind":"line","player":false,"speaker":"MRS. PELL","text":"She heard men arriving too confident and leaving too quickly. In this town that narrows nothing."},{"id":"pell_maid_heard","kind":"notebook","text":"Mrs. Pell admitted her maid heard men arriving and departing the ridge in haste, but gave no names."},{"id":"ridge_haste","kind":"evidence"}],"tag":"pell_servants","timing":"4"},{"gate":{"left":{"args":["local_historian","crew_omission_official"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["mrs_pell","crew_omission"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"topic_done(local_historian, crew_omission_official) AND NOT topic_done(mrs_pell, crew_omission)","id":"crew_omission","label":"Ask why the town's history leaves out the crew's names","line":42,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The memorial on the common lists every owner who subscribed to the rebuilding fund.\nIt does not list the men who drowned."},{"kind":"line","player":false,"speaker":"MRS. PELL","text":"A subscription is a matter of public record.\nA drowning is a matter of the sea."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The sea didn't write the memorial. The committee did."},{"kind":"beat","text":"She releases the gate latch and lets it click shut between them."},{"kind":"line","player":false,"speaker":"MRS. PELL","text":"My grandfather sat on that committee, Officer.\nHe was not a cruel man.\nHe was a practical one.\nThere is a difference, and it has served this ridge for a hundred years."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"It served the ridge. I'm asking about the crew."},{"kind":"line","player":false,"speaker":"MRS. PELL","text":"Then ask the harbor. The harbor keeps its own account."},{"id":"pell_crew_omission","kind":"notebook","text":"Mrs. Pell acknowledged her grandfather sat on the memorial committee. Framed the omission as practical rather than cruel. Referred to 'the harbor' as the keeper of a different account."}],"tag":"mrs_pell_crew_omission","timing":"4"}]},"net_seller":{"color":"#608060","label":"Net Seller","location":"waterfront","schedule":{"evening":"closed","midday":"waterfront_net_loft","morning":"waterfront_net_loft","night":"closed"},"source":"dialogue/net_seller.dialogue","topics":[{"gate":{"left":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"op":"and","right":{"args":["net_seller"],"call":true,"cmp":">=","name":"visit_count","op":"cmp","value":"2"}},"gate_src":"coat = plain AND visit_count(net_seller) >= 2","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"NET SELLER","text":"Still walking the timbers without the brass, Officer?\nMind the tar bucket by the bench."}],"tag":"net_seller_plain_repeat","timing":"0"},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"default","label":"","line":11,"steps":[{"kind":"line","player":false,"speaker":"NET SELLER","text":"Nets, lines, or crabbing pots. Otherwise you're in my light."}],"tag":"net_seller_default","timing":"2"},{"gate":{"left":{"args":["local_historian","crew_omission_official"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["net_seller","crew_omission"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"topic_done(local_historian, crew_omission_official) AND NOT topic_done(net_seller, crew_omission)","id":"crew_omission","label":"Ask why the town's history leaves out the crew's names","line":17,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The men who drowned in 1823 — their names aren't in any record."},{"kind":"line","player":false,"speaker":"NET SELLER","text":"Ours are."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Where?"},{"kind":"line","player":false,"speaker":"NET SELLER","text":"In the families. In the boats we named after them.\nIn the berths we don't give to strangers."},{"kind":"beat","text":"She does not look up from the netting needle."},{"kind":"line","player":false,"speaker":"NET SELLER","text":"You're asking why the town didn't write them down.\nThe town didn't lose them.\nWe did."},{"id":"net_seller_crew_omission","kind":"notebook","text":"The net seller said the drowned crew's names are preserved in the harbor families, not in civic records. She drew a clear line between 'the town' and 'we.'"}],"tag":"net_seller_crew_omission","timing":"4"},{"gate":{"left":{"args":["sub_harbor_drag"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["net_seller","harbor_currents"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(sub_harbor_drag) AND NOT topic_done(net_seller, harbor_currents)","id":"harbor_currents","label":"Ask about the unnatural stillness before the murders","line":30,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Mrs. Peake said the tide went dead flat at three in the morning, three nights back."},{"kind":"line","player":false,"speaker":"NET SELLER","text":"Lydia Peake hears with her ears. I watch the lead weights."},{"kind":"beat","text":"She holds up a hemp line strung with grey lead sinkers."},{"kind":"line","player":false,"speaker":"NET SELLER","text":"A flat surface is a trick for men in rowboats, Officer.\nDown twelve fathoms, the water was running inland. Not toward the bay. Toward the hill."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Toward the hill?"},{"kind":"line","player":false,"speaker":"NET SELLER","text":"Toward the bluff where the estates sit. The line didn't drift east on the ebb.\nIt pulled straight into the rock beneath the kitchen wing."},{"id":"net_seller_currents_1","kind":"notebook","text":"Net seller observed deep harbor currents running unnaturally inland toward the estate bluff rather than out with the ebb tide."},{"id":"inland_subsea_current","kind":"evidence"}],"tag":"net_seller_currents","timing":"4"},{"gate":{"expr":{"args":["net_seller","stone_sinkers"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(net_seller, stone_sinkers)","id":"stone_sinkers","label":"Ask why the skiffs by the slipway use grooved stones instead of iron anchors","line":44,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I noticed three dories tied at the slip with grooved granite stones for anchors. Iron's cheap enough at the chandlery."},{"kind":"line","player":false,"speaker":"NET SELLER","text":"Iron rings."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Rings?"},{"kind":"line","player":false,"speaker":"NET SELLER","text":"Drop a five-prong iron grapnel on the ledge out past the point at three in the morning, and the clatter travels three miles through the granite shelf like a tapped telegraph line.\nGranite against granite makes a thud. Nothing wakes up.\nDown here, we like what's quiet."},{"id":"net_seller_stone_sinkers","kind":"notebook","text":"Net seller explained the dories use grooved granite stones instead of iron grapnels because iron striking the undersea granite shelf rings like a tapped telegraph wire across the bay."},{"id":"stone_sinker_discipline","kind":"evidence"}],"tag":"net_seller_sinkers","timing":"4"},{"gate":{"left":{"left":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"op":"and","right":{"args":["observer_color_tell"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"op":"and","right":{"expr":{"args":["net_seller","copper_rings"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"coat = plain AND evidence(observer_color_tell) AND NOT topic_done(net_seller, copper_rings)","id":"copper_rings","label":"Ask why the harbor people wear beaten copper rings","line":56,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The mason wears a band made from an anchor link. Is that common here?"},{"kind":"line","player":false,"speaker":"NET SELLER","text":"You'll have to ask him about his belongings."},{"kind":"beat","text":"She lifts a snagged loop clear of the needle. Her thumb rests briefly against the worn metal of her gauge."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I thought you might know him."},{"kind":"line","player":false,"speaker":"NET SELLER","text":"I know this net wants finishing."},{"id":"net_seller_ring_discipline","kind":"notebook","text":"The net seller declined to discuss the mason's band and returned to repairing her net. She offered no explanation for it."},{"id":"eye_anchoring_discipline","kind":"evidence"}],"tag":"net_seller_rings","timing":"5"}]},"odell":{"color":"#c0392b","label":"Captain Odell","location":"estate","schedule":{},"source":"dialogue/odell.dialogue","topics":[{"gate":{"expr":{"args":["odell","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(odell, default)","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"CAPTAIN ODELL","text":"A gas-main tragedy.\nOr something close enough for the morning edition."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"There are eight bodies. Six club members. A woman and a boy beyond the birches.\n\nNobody has established an accident."},{"kind":"line","player":false,"speaker":"CAPTAIN ODELL","text":"Six members, Corwin.\nThe other two are a filing matter."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Eight people are dead."},{"kind":"line","player":false,"speaker":"CAPTAIN ODELL","text":"Then put your observations in writing.\n\nI need a preliminary report.\nI do not need a quarrel before breakfast."},{"id":"eight","kind":"evidence"},{"kind":"fork","options":[{"label":"I understand it. I don't accept it.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"I understand it. I don't accept it."},{"id":"default_1_1","kind":"notebook","text":"Walter told Odell to his face that six was not the whole count. Odell did not answer."}]},{"label":"Say nothing. Write it down instead.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Say nothing. Write it down instead."},{"id":"default_1_2","kind":"notebook","text":"Walter wrote EIGHT in his own file, in a hand larger than his usual notation, and said nothing further to the captain."}]}]}],"tag":"odell","timing":"8"}]},"old_woman":{"color":"#2c3e50","label":"Old Woman","location":"town","schedule":{},"source":"dialogue/old_woman.dialogue","topics":[{"gate":{"left":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["old_woman"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(naomi) AND NOT evidence(old_woman)","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"OUTSIDE THE SHUTTERED SHOP","text":"An old woman waits by Kessler's boarded windows. She has been waiting, Walter suspects, for someone in a coat like his."},{"kind":"line","player":false,"speaker":"THE OLD WOMAN","text":"You're looking at the men.\n\nLook at what they looked at."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Who?"},{"kind":"line","player":false,"speaker":"THE OLD WOMAN","text":"The old ones don't love.\n\n[She crosses herself.]"},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What do you mean, the old ones?"},{"kind":"line","player":false,"speaker":"THE OLD WOMAN","text":"Beware the old gods, Officer. They have no boundaries, and no need of them.\n\nMen name the ocean too. Doesn't mean the ocean knows."},{"id":"","kind":"notebook","text":"She is gone before he finishes the sentence.\n\nHe writes what he remembers of it, exactly as given. He does not yet have a place on the board where it belongs."},{"id":"old_woman","kind":"evidence"}],"tag":"old_woman","timing":"6"}]},"post_office_clerk":{"color":"#27ae60","label":"Mr. Crump (Post Office)","location":"post_office","schedule":{"evening":"post_office","midday":"post_office","morning":"post_office","night":"closed"},"source":"dialogue/post_office_clerk.dialogue","topics":[{"gate":{"left":{"expr":{"args":["post_office_clerk","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(post_office_clerk, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"Window closes at five sharp."},{"kind":"beat","text":"He thumps a circular cancellation stamp onto an envelope with rhythmic precision."},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"General delivery to the left, money orders and parcel post to the right.\nHave your postage counted before you reach the brass grate."}],"tag":"postal_plain","timing":""},{"gate":{"expr":{"args":["post_office_clerk","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(post_office_clerk, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"Officer. If this is official mail for Captain Odell, the precinct pouch went out at eight."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I'm asking about general delivery."},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"Federal mail is confidential by act of Congress, Corwin.\nUnless you have a warrant signed by a federal magistrate."}],"tag":"postal_badge","timing":""},{"gate":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(naomi)","id":"naomi_letters","label":"Inquire about mail held for Naomi Freeman","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Naomi Freeman. Did she receive mail in general delivery before she died?"},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"Two letters. Both from New Bedford."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Who sent them?"},{"kind":"beat","text":"Mr. Crump flips through a cubby of uncollected yellowed envelopes behind the brass grille."},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"Postmarked three weeks ago. Addressed in a schoolchild's round hand, with adult corrections in pencil."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What did the return address say?"},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"'Freeman, care of Bethel Mission, New Bedford.'\nOne was marked 'For Mama and Brother.'"},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"There's someone at that mission still waiting on an answer that isn't coming."},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"Then he will wait until the ninety-day unclaimed window expires, Officer.\nThen regulations require me to return them to the dead-letter office in Washington."},{"id":"postal_naomi_1","kind":"notebook","text":"Post office holds two letters from New Bedford for Naomi Freeman, addressed from a child via Bethel Mission: 'For Mama and Brother.'"},{"id":"new_bedford_letters","kind":"evidence"}],"tag":"postal_naomi","timing":"7"},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"ophion_club_mail","label":"Ask about correspondence received by the Ophion Club","line":38,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The private post for the Ophion Club. Who collects it?"},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"The steward. Every Tuesday morning with a leather locking pouch."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Where does their outside mail originate?"},{"kind":"fork","options":[{"label":"Ask about foreign post.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask about foreign post."},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"Heavy packets from Liverpool and Smyrna. Burlap-wrapped parcels stamped by maritime customs in Boston.\nAlways insured to the maximum ceiling. Smelled of camphor and dry brine."},{"id":"postal_foreign_packets","kind":"notebook","text":"Ophion Club received heavy insured parcels from Liverpool and Smyrna, smelling of camphor and brine."},{"id":"club_foreign_freight","kind":"evidence"}]},{"label":"Ask about banking correspondence.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask about banking correspondence."},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"Drafts from the Boston Marine Bank. Monthly registered statements addressed to 'The Overseer.'\nNever an individual's name on the envelope. Just the box number and that title."},{"id":"postal_overseer_drafts","kind":"notebook","text":"Monthly registered bank drafts arrived from Boston Marine Bank addressed solely to 'The Overseer.'"},{"id":"postal_overseer_statements","kind":"evidence"}]}]}],"tag":"postal_club_mail","timing":"6"},{"gate":{"left":{"args":["new_bedford_letters"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["post_office_clerk","holding_the_letters"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(new_bedford_letters) AND NOT topic_done(post_office_clerk, holding_the_letters)","id":"holding_the_letters","label":"Attempt to take custody of the child's letters","line":56,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Hand over the letters from the boy. They're material to a murder investigation."},{"kind":"beat","text":"Mr. Crump slides the cubby drawer shut with a deliberate wooden snap."},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"Section 3891 of the Revised Statutes, Officer. A local policeman cannot seize federal post without judicial subpoena.\nCaptain Odell knows the law even if his beat patrol doesn't."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The woman is in the morgue, Crump. The child who wrote them is six years old."},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"The United States Post Office does not alter postal statutes because a patron suffered a misfortune, Corwin.\nBring me a federal order, or leave the window."},{"id":"postal_refusal_1","kind":"notebook","text":"Postmaster refused to surrender Naomi's letters from her six-year-old son, citing federal postal statute Section 3891."},{"id":"postal_bureaucracy_refusal","kind":"evidence"}],"tag":"postal_release","timing":"5"},{"gate":{"left":{"args":["local_historian","crew_omission_official"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["post_office_clerk","crew_omission"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"topic_done(local_historian, crew_omission_official) AND NOT topic_done(post_office_clerk, crew_omission)","id":"crew_omission","label":"Ask why the town's history leaves out the crew's names","line":70,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Why does the town's history leave out the crew's names?"},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"I deliver the Historical Society's circulars. I don't compose them."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"You have never wondered whose names are missing?"},{"kind":"line","player":false,"speaker":"MR. CRUMP","text":"I have a queue, Officer. The museum can answer for its own envelopes."},{"id":"crew_omission_refusal","kind":"notebook","text":"Asked Mr. Crump why the crew's names are missing from the town's history. No explanation supplied; the question remains open."}],"tag":"post_office_clerk_crew_omission","timing":"3"}]},"quay_bookkeeper":{"color":"#2980b9","label":"Mr. Vale (Bookkeeper)","location":"waterfront","schedule":{"evening":"closed","midday":"quay_office","morning":"quay_office","night":"closed"},"source":"dialogue/mr_vale.dialogue","topics":[{"gate":{"left":{"expr":{"args":["quay_bookkeeper","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(quay_bookkeeper, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MR. VALE","text":"The office is closed."},{"kind":"beat","text":"He aligns the corner of a loose invoice with the ledger beneath it."},{"kind":"line","player":false,"speaker":"MR. VALE","text":"But you did not come dressed as an office.\n\nWhat are you asking?"}],"tag":"bookkeeper_plain","timing":""},{"gate":{"expr":{"args":["quay_bookkeeper","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(quay_bookkeeper, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MR. VALE","text":"If this concerns the estate accounts, Officer, the books have already been examined."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"By whom?"},{"kind":"line","player":false,"speaker":"MR. VALE","text":"By everyone entitled to say they examined them."}],"tag":"bookkeeper_badge","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"work","label":"Ask what records the office keeps","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What passes through these books?"},{"kind":"line","player":false,"speaker":"MR. VALE","text":"Freight. Wages. Berthing fees. Repairs when the repair was admitted.\nDebts when the debtor had a name worth writing."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And when the name was not worth writing?"},{"kind":"line","player":false,"speaker":"MR. VALE","text":"Then someone generally found a broader word."}],"tag":"bookkeeper_work","timing":"3"},{"gate":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(naomi)","id":"unfamiliar_woman","label":"Ask whether Naomi came to the office","line":31,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Naomi Freeman. Did she bring that name here?"},{"kind":"line","player":false,"speaker":"MR. VALE","text":"A woman brought it.\nWhether the office kept it is a different question."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"You remember her."},{"kind":"line","player":false,"speaker":"MR. VALE","text":"I remember correcting the clerk who wrote 'inquiry' where she had said 'claim.'"},{"id":"bookkeeper_naomi_1","kind":"notebook","text":"A quay-office clerk initially reduced Naomi Freeman's claim to an inquiry. Mr. Vale remembers correcting the entry."},{"id":"quay_inquiry","kind":"evidence"}],"tag":"bookkeeper_naomi","timing":"4"},{"gate":{"left":{"args":["lay_lead"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"args":["quay_inquiry"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"gate_src":"evidence(lay_lead) AND evidence(quay_inquiry)","id":"old_lay","label":"Ask how an old whaler's lay would be recorded","line":43,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"If a whaler's lay went unpaid, where would the debt appear?"},{"kind":"line","player":false,"speaker":"MR. VALE","text":"In the owner's book first. In the harbor copy if anyone expected an argument.\nIn neither, if everyone who could argue was already at sea."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Could the omission be proved?"},{"kind":"line","player":false,"speaker":"MR. VALE","text":"An omission is proved by finding what had to exist on either side of it."},{"id":"","kind":"notebook","text":"An unpaid lay may leave no direct entry.\nSeek adjoining records: crew list, voyage account, owner disbursement, harbor copy."},{"id":"lay_record_method","kind":"evidence"}],"tag":"bookkeeper_lay","timing":"4"},{"gate":{"args":["service_work"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(service_work)","id":"estate_freight","label":"Ask about deliveries to the estate","line":55,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did the estate receive anything unusual before the deaths?"},{"kind":"line","player":false,"speaker":"MR. VALE","text":"Unusual things arrive under ordinary descriptions.\nThat is one purpose of an ordinary description."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Which description?"},{"kind":"line","player":false,"speaker":"MR. VALE","text":"Kitchen stone. Two carts billed.\nThree crossed the quay."},{"id":"bookkeeper_estate_1","kind":"notebook","text":"Estate freight discrepancy: two carts of kitchen stone billed, three observed crossing the quay."},{"id":"estate_freight","kind":"evidence"}],"tag":"bookkeeper_estate","timing":"4"},{"gate":{"args":["estate_freight"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(estate_freight)","id":"missing_cart","label":"Press him about the third cart","line":67,"steps":[{"kind":"fork","options":[{"label":"Put the discrepancy in writing.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Put the discrepancy in writing."},{"kind":"line","player":false,"speaker":"MR. VALE","text":"It already was."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Then show me."},{"kind":"line","player":false,"speaker":"MR. VALE","text":"I said it was written.\nI did not say the writing was kept."},{"id":"bookkeeper_cart_destroyed","kind":"notebook","text":"A record of the estate's third freight cart existed but is no longer retained at the quay office."},{"id":"cart_record_missing","kind":"evidence"}]},{"label":"Tell me who signed for it.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Tell me who signed for it."},{"kind":"line","player":false,"speaker":"MR. VALE","text":"No one signed."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Three carts crossed without a receiving name?"},{"kind":"line","player":false,"speaker":"MR. VALE","text":"One did.\nThat is why I remember the number."},{"id":"bookkeeper_cart_unsigned","kind":"notebook","text":"The unbilled third cart crossed without a receiving signature. Mr. Vale remembers the procedural exception."},{"id":"cart_unsigned","kind":"evidence"}]}]}],"tag":"bookkeeper_missing_cart","timing":"7"},{"gate":{"left":{"args":["quay_inquiry"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["quay_bookkeeper","records"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(quay_inquiry) AND NOT topic_done(quay_bookkeeper, records)","id":"records","label":"Ask why records disappear","line":86,"steps":[{"kind":"line","player":false,"speaker":"MR. VALE","text":"Records do not disappear as often as people say."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What happens to them?"},{"kind":"line","player":false,"speaker":"MR. VALE","text":"One clerk files a paper under the ship. Another looks under the owner.\nA third decides the matter was never properly submitted."},{"kind":"line","player":false,"speaker":"MR. VALE","text":"By the time anyone calls it missing, every hand involved has done something defensible."},{"id":"bookkeeper_records_1","kind":"notebook","text":"The quay office does not require a deliberate falsification to lose a record. Separate defensible filing decisions can make a fact practically unrecoverable."}],"tag":"bookkeeper_records","timing":""},{"gate":{"left":{"left":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"op":"and","right":{"args":["quay_inquiry"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"op":"and","right":{"expr":{"args":["quay_bookkeeper","coat"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"coat = plain AND evidence(quay_inquiry) AND NOT topic_done(quay_bookkeeper, coat)","id":"coat","label":"Ask why he answered without the badge","line":96,"steps":[{"kind":"line","player":false,"speaker":"MR. VALE","text":"A badge requires an answer that can survive being repeated."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And this coat?"},{"kind":"line","player":false,"speaker":"MR. VALE","text":"That coat permits a man to remember what no office is prepared to certify."}],"tag":"bookkeeper_coat","timing":""}]},"quay_docker":{"color":"#608060","label":"Quay Docker","location":"waterfront","schedule":{"evening":"closed","midday":"waterfront_moorings","morning":"waterfront_moorings","night":"closed"},"source":"dialogue/quay_docker.dialogue","topics":[{"gate":{"left":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"op":"and","right":{"args":["quay_docker"],"call":true,"cmp":">=","name":"visit_count","op":"cmp","value":"2"}},"gate_src":"coat = plain AND visit_count(quay_docker) >= 2","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"QUAY DOCKER","text":"Look at that — Officer Corwin looking like he might actually haul a rope.\nDon't drop your boots in the scum, Corwin."}],"tag":"quay_docker_plain_repeat","timing":"0"},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"default","label":"","line":11,"steps":[{"kind":"line","player":false,"speaker":"QUAY DOCKER","text":"Tide's been slack since six. Nothing's moving today that wasn't stuck yesterday."}],"tag":"quay_docker_default","timing":"2"},{"gate":{"left":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["quay_docker","naomi_sighting"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(naomi) AND NOT topic_done(quay_docker, naomi_sighting)","id":"naomi_sighting","label":"Ask if anyone saw Naomi Freeman near the water","line":17,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"A woman named Naomi Freeman. Did you see her here recently?"},{"kind":"line","player":false,"speaker":"QUAY DOCKER","text":"Small? Quick? Carried a satchel like it had opinions?"},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"That would be her."},{"kind":"line","player":false,"speaker":"QUAY DOCKER","text":"Three days back, maybe four.\nShe was asking about the mud calendar.\nWho tracks the tidal drift, that sort of thing.\nI told her Peake would know."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did she go to Peake?"},{"kind":"line","player":false,"speaker":"QUAY DOCKER","text":"Couldn't say.\nShe wrote something down and left.\nShe always wrote something down."},{"id":"docker_naomi_sighting","kind":"notebook","text":"The quay docker saw Naomi Freeman three or four days before the inquiry. She was asking about tidal drift records and the mud calendar. He directed her to Peake. He noted she was always writing."},{"id":"naomi_quay_inquiry","kind":"evidence"}],"tag":"quay_docker_naomi_sighting","timing":"5"},{"gate":{"left":{"args":["estate_freight"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["quay_docker","estate_freight_carts"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(estate_freight) AND NOT topic_done(quay_docker, estate_freight_carts)","id":"estate_freight_carts","label":"Ask about the three carts of stone sent to the estate","line":31,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Mr. Vale says three carts of stone crossed the quay to the estate, but only two were billed."},{"kind":"line","player":false,"speaker":"QUAY DOCKER","text":"Vale sits on a stool and pushes a pencil. I muscled the tailboards."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What was on the third cart?"},{"kind":"fork","options":[{"label":"Ask about the weight of the load.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask about the weight of the load."},{"kind":"line","player":false,"speaker":"QUAY DOCKER","text":"Granite's heavy, but granite doesn't squelch when you drop it on the planks."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Squelch?"},{"kind":"line","player":false,"speaker":"QUAY DOCKER","text":"Wet timber. Old balks wrapped in burlap, soaked through with grease and black mud.\nSmelled like the old try-works flats after a three-day blowout."},{"id":"docker_cart_weight","kind":"notebook","text":"Quay docker confirms third unbilled cart held waterlogged, muddy timber from try-works flats rather than kitchen stone."},{"id":"tryworks_timber_freight","kind":"evidence"}]},{"label":"Ask who took the reins.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask who took the reins."},{"kind":"line","player":false,"speaker":"QUAY DOCKER","text":"Not one of our teamsters.\nA man from the estate stables in black driver's serge.\nHe wouldn't let any docker touch the tail-rope. Handed me a half-dollar and told me to take my smoke behind the coal bins."},{"id":"docker_cart_driver","kind":"notebook","text":"Quay docker: the unbilled third cart was driven by estate staff in black serge, who bribed dockers to look away."},{"id":"estate_private_driver","kind":"evidence"}]}]}],"tag":"quay_docker_freight","timing":"6"}]},"ropewalk_foreman":{"color":"#608060","label":"Ropewalk Foreman","location":"waterfront","schedule":{"evening":"closed","midday":"waterfront_fish_stores","morning":"waterfront_fish_stores","night":"closed"},"source":"dialogue/ropewalk_foreman.dialogue","topics":[{"gate":{"left":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"op":"and","right":{"args":["ropewalk_foreman"],"call":true,"cmp":">=","name":"visit_count","op":"cmp","value":"2"}},"gate_src":"coat = plain AND visit_count(ropewalk_foreman) >= 2","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"ROPEWALK FOREMAN","text":"Still got tar on your trouser hem, Corwin.\nMind the spinning jack if you're coming down the walk."}],"tag":"ropewalk_plain_repeat","timing":"0"},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"default","label":"","line":11,"steps":[{"kind":"line","player":false,"speaker":"ROPEWALK FOREMAN","text":"If you're not buying cord or waiting on a coil, the quay wall's that way."}],"tag":"ropewalk_foreman_default","timing":"2"},{"gate":{"left":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["ropewalk_foreman","island_supply"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(naomi) AND NOT topic_done(ropewalk_foreman, island_supply)","id":"island_supply","label":"Ask about supply runs to the offshore island","line":17,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The whaling station on the island. When did it last take a supply run?"},{"kind":"line","player":false,"speaker":"ROPEWALK FOREMAN","text":"That station's been dead ground since the flood.\nNothing goes out there on my log."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Nothing official."},{"kind":"beat","text":"He sets down the wooden spool he was threading. Meets Walter's eye for the first time."},{"kind":"line","player":false,"speaker":"ROPEWALK FOREMAN","text":"A private boat doesn't need my log.\nA private boat doesn't need anyone's log.\nThat's the point of a private boat."},{"id":"foreman_island_supply","kind":"notebook","text":"The rope-walk foreman confirmed no supply run to the island appears in his ledger. He acknowledged that a private boat would leave no record. He did not say one had gone."}],"tag":"ropewalk_foreman_island_supply","timing":"5"},{"gate":{"left":{"args":["gray_salt_cakes"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["ropewalk_foreman","cellar_salt"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(gray_salt_cakes) AND NOT topic_done(ropewalk_foreman, cellar_salt)","id":"cellar_salt","label":"Ask why someone would carry harbor curing salt inland","line":29,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Otto Kessler carried cakes of gray harbor curing salt to the estate.\nWhy would kitchen cellars need harbor salt?"},{"kind":"line","player":false,"speaker":"ROPEWALK FOREMAN","text":"Curing salt isn't for kitchens, Walter. Kitchen salt is fine white grain."},{"kind":"beat","text":"He wipes powdered pitch from his palms onto a leather apron."},{"kind":"line","player":false,"speaker":"ROPEWALK FOREMAN","text":"Grey harbor salt is packed with bitumen and dried brine scum.\nYou lay three-pound cakes along door joints and stone foundations to pull moisture out of sealed seams so timber doesn't swell shut."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"To keep a door from sticking?"},{"kind":"line","player":false,"speaker":"ROPEWALK FOREMAN","text":"Or to keep whatever is on the damp side of the stone from leaking through the mortar."},{"id":"ropewalk_salt_purpose","kind":"notebook","text":"Foreman explains gray harbor salt cakes are used to desiccate stone seams and keep sealed cellar doors from swelling shut."},{"id":"cellar_desiccation_practice","kind":"evidence"}],"tag":"ropewalk_salt","timing":"5"},{"gate":{"left":{"args":["estate_conduit_map"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["ropewalk_foreman","estate_mooring_cable"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(estate_conduit_map) AND NOT topic_done(ropewalk_foreman, estate_mooring_cable)","id":"estate_mooring_cable","label":"Ask about heavy hawser supplied to the estate bluff","line":43,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did the estate order heavy marine cordage recently?"},{"kind":"line","player":false,"speaker":"ROPEWALK FOREMAN","text":"Two hundred fathoms of four-inch tarred Manila.\nHeavy enough to anchor an eighty-ton schooner against a nor'easter."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"For what purpose?"},{"kind":"line","player":false,"speaker":"ROPEWALK FOREMAN","text":"Billed to Elias Pruitt's account as 'bluff retaining tackle.'\nDelivered straight to the kitchen cartway three weeks before the deaths.\nYou don't hold up a flower bed with four-inch Manila, Officer."},{"id":"ropewalk_estate_hawser","kind":"notebook","text":"Foreman confirms two hundred fathoms of 4-inch tarred Manila hawser delivered to estate kitchen cartway three weeks prior."},{"id":"heavy_subterranean_tackle","kind":"evidence"}],"tag":"ropewalk_cable","timing":"6"}]},"salt_mender":{"color":"#2980b9","label":"Mrs. Peake (Salt Mender)","location":"lower_residential","schedule":{"evening":"lower_house_2","midday":"quay","morning":"lower_house_2","night":"lower_house_2"},"source":"dialogue/salt_mender.dialogue","topics":[{"gate":{"left":{"expr":{"args":["salt_mender","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(salt_mender, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"Watch where you step on that brine net. It's drying in the sun."},{"kind":"beat","text":"She uses a bone netting needle to knot tarred cord with practiced, rhythmic snaps."},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"You've got the look of someone with a room that gets cold by midnight.\nIf you're looking for Mrs. Almy's, it's three doors up the hill."}],"tag":"mender_plain","timing":""},{"gate":{"expr":{"args":["salt_mender","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(salt_mender, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"Nothing stolen on this alley, Officer.\nWe don't keep silver spoons to tempt anybody."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I'm not looking for thieves, Mrs. Peake."},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"Then you're looking for trouble.\nDown here, the two usually arrive in the same coat."}],"tag":"mender_badge","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"night_sounds","label":"Ask about unusual sounds from the harbor at night","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Do you hear the water from this porch?"},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"I've heard this harbor since eighteen eighty, Walter Corwin.\nI know what the swell sounds like against the breakwater."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And lately?"},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"Three nights back, just before the bells for three. The tide went dead flat.\nNo chop. No lap against the piles. Like grease on a skillet."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And then?"},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"A dragging sound. Heavy. Not a keel scraping mud.\nBeneath the pilings. Like something enormous being shifted through wet sand without a wave to move it.\nMy husband took his boots off and sat by the stove until daylight."},{"id":"mender_tide_silence","kind":"notebook","text":"Mrs. Peake: dead flat tide at 3:00 AM before the deaths, followed by an unnatural heavy dragging through silt beneath the harbor piles."},{"id":"sub_harbor_drag","kind":"evidence"}],"tag":"mender_sounds","timing":"7"},{"gate":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(naomi)","id":"naomi_and_the_boy","label":"Ask if she spoke to Naomi Freeman","line":35,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did Naomi come past your porch?"},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"She brought me a tin of lard from town. Said the boy had torn his trouser knee on the rocks and asked if I had strong sailmaker's thread."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did she say why they were by the rocks?"},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"Looking at the island. The boy had his pockets full of round beach stones. He was setting them out in a straight line on the sand, twenty paces apart."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Twenty paces?"},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"Counting his strides under his breath like a clerk. Then he'd look up at the try-works masonry on the spit, squint over a pencil stub, and move a pebble two inches left.\nNot child's play. He was drafting a survey map on the mud."},{"kind":"beat","text":"She bites through the heavy twine with her teeth."},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"I told Naomi nobody went out to that mud for sixty years.\nShe looked at me and said, 'The mud didn't make the debt, ma'am. Men did.'\nI couldn't find an argument to give her back."},{"id":"mender_naomi_quote","kind":"notebook","text":"Mrs. Peake: Naomi and her boy were pacing distances and setting pebbles twenty strides apart to map the try-works masonry against the bluff. Naomi: 'The mud didn't make the debt, ma'am. Men did.'"},{"id":"naomi_moral_clarity","kind":"evidence"},{"id":"boy_pebble_survey","kind":"evidence"}],"tag":"mender_naomi","timing":"5"},{"gate":{"left":{"args":["local_historian","crew_omission_official"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["salt_mender","crew_omission"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"topic_done(local_historian, crew_omission_official) AND NOT topic_done(salt_mender, crew_omission)","id":"crew_omission","label":"Ask why the town's history leaves out the crew's names","line":52,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The men who drowned in 1823. Why aren't their names anywhere?"},{"kind":"beat","text":"Mrs. Peake does not look up from the net."},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"They are."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Where?"},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"Down here.\nEvery family on this alley has a name from that water.\nWe don't need a committee to spell it for us."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I mean in the record. In the memorial. In the school reader."},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"I know what you mean."},{"kind":"beat","text":"She bites through the twine and begins the next row."},{"kind":"line","player":false,"speaker":"MRS. PEAKE","text":"The hill decides what goes in the reader.\nWe decided a long time ago that it wasn't worth the argument.\nNaomi Freeman hadn't made that decision yet.\nYou can see how that went for her."},{"id":"peake_crew_omission","kind":"notebook","text":"Mrs. Peake says the drowned crew's names are preserved in the lower harbor families, not in any official record. The hill's version was not worth fighting. Naomi Freeman had not accepted that. Mrs. Peake did not say this as an accusation."}],"tag":"salt_mender_crew_omission","timing":"5"}]},"school_parent":{"color":"#27ae60","label":"Mrs. Teague (Parent)","location":"business_district","schedule":{"evening":"upper_house_3","midday":"schoolhouse_gate","morning":"upper_house_3","night":"upper_house_3"},"source":"dialogue/school_parent.dialogue","topics":[{"gate":{"left":{"expr":{"args":["school_parent","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(school_parent, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MRS. TEAGUE","text":"The children will be out in five minutes."},{"kind":"beat","text":"She pulls her wool shawl tighter against the harbor breeze, watching the schoolhouse doors."},{"kind":"line","player":false,"speaker":"MRS. TEAGUE","text":"I don't care to have men loitering by the railing while classes let out, mister."}],"tag":"parent_plain","timing":""},{"gate":{"expr":{"args":["school_parent","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(school_parent, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MRS. TEAGUE","text":"Officer Corwin. I hope you're not here to question the little ones about the estate."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I'm looking for anyone who saw visitors in town."},{"kind":"line","player":false,"speaker":"MRS. TEAGUE","text":"Visitors? This town has people who live here and people who ought not to be here.\nThat isn't complicated."}],"tag":"parent_badge","timing":""},{"gate":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(naomi)","id":"the_stranger_woman","label":"Ask if she saw Naomi Freeman and her boy","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"You walk down from the ridge past the boardinghouse every noon.\nDid you see the colored woman and her son?"},{"kind":"line","player":false,"speaker":"MRS. TEAGUE","text":"I saw them sitting on the low wall by the apothecary three mornings running."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did they speak to anyone?"},{"kind":"line","player":false,"speaker":"MRS. TEAGUE","text":"The boy had a pocketful of smooth beach pebbles. He was lining them up in rows on the coping stones.\nMethodical little thing. Counting them in whisper."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And the mother?"},{"kind":"line","player":false,"speaker":"MRS. TEAGUE","text":"She had an envelope tucked in her glove. Heavy paper, folded into four.\nShe didn't ask for charity. That's what bothered people, if you want the honest truth."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Why would that bother anyone?"},{"kind":"line","player":false,"speaker":"MRS. TEAGUE","text":"Because a pauper asks, and you give them two pennies or you don't, and the matter is settled.\nShe walked like someone who had come to collect what was already hers. That makes people nervous, Officer."},{"id":"parent_naomi_attitude","kind":"notebook","text":"Mrs. Teague: Naomi Freeman 'walked like someone who had come to collect what was already hers. That makes people nervous.'"},{"id":"naomi_unapologetic_presence","kind":"evidence"}],"tag":"parent_naomi_sighting","timing":"7"},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"the_estate_talk","label":"Ask what the ridge families are saying about the club deaths","line":37,"steps":[{"kind":"fork","options":[{"label":"Ask about Judge Wexford.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask about Judge Wexford."},{"kind":"line","player":false,"speaker":"MRS. TEAGUE","text":"Wexford was a stern magistrate. My husband sat on three grand juries with him.\nPeople say it was foul gas from the lower furnace pipes, but I know what Judge Wexford's housemaid found last Sunday."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What did she find?"},{"kind":"line","player":false,"speaker":"MRS. TEAGUE","text":"Every mirror in the entry hall turned with its glass to the wall. And thirty pounds of coarse sea salt swept under the parlor rug.\nShe quit her place because she found the Judge sleeping upright in his library armchair with his boots tied together at the laces."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Tied together?"},{"kind":"line","player":false,"speaker":"MRS. TEAGUE","text":"Knotted with heavy hemp, Officer. So he wouldn't sleepwalk toward the cliff in the dark."},{"id":"parent_wexford_mirrors","kind":"notebook","text":"Judge Wexford's housemaid quit after finding mirrors turned to the wall, 30 lbs of salt under carpets, and Wexford sleeping upright with boots tied together to prevent sleepwalking to the cliff."},{"id":"turned_mirrors","kind":"evidence"}]},{"label":"Ask about Dr. Fenn.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask about Dr. Fenn."},{"kind":"line","player":false,"speaker":"MRS. TEAGUE","text":"Dr. Fenn delivered both my boys. A gentleman, though he grew peculiar after his sister passed.\nHe wouldn't prescribe camphor anymore. Said the smell 'attracted things from the cellar.'\nWe thought it was his age."},{"id":"parent_fenn_peculiar","kind":"notebook","text":"Dr. Fenn stopped prescribing camphor, claiming the odor 'attracted things from the cellar.'"},{"id":"fenn_camphor_taboo","kind":"evidence"}]}]}],"tag":"parent_estate_rumor","timing":"7"}]},"schoolteacher":{"color":"#27ae60","label":"Miss Hallowell (Teacher)","location":"business_district","schedule":{"evening":"upper_house_2","midday":"schoolhouse","morning":"schoolhouse","night":"upper_house_2"},"source":"dialogue/schoolteacher.dialogue","topics":[{"gate":{"left":{"expr":{"args":["schoolteacher","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(schoolteacher, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"Please leave the children's desks as you found them."},{"kind":"beat","text":"She dusts chalk from her cuffs with small, sharp motions, looking over the empty rows of wooden desks."},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"If you're a parent inquiring about reading primers, speak to the school board on Tuesday.\n\nOtherwise, I am grading geography slates."}],"tag":"teacher_plain","timing":""},{"gate":{"expr":{"args":["schoolteacher","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(schoolteacher, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"Officer Corwin. I hope you haven't come to disturb the children with talk of the garden."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The children know?"},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"A town like this doesn't need to speak a thing for a child to hear it.\nThey arrived quiet as mice this morning. I had them recite the county psalm twice."}],"tag":"teacher_badge","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"town_founding","label":"Ask how the town's history is taught to the children","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What does the school reader say about the Ophion?"},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"The reader says what is fitting for young minds to absorb."},{"kind":"beat","text":"She points a piece of chalk toward a slate map of the Massachusetts coast on the wall."},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"It says a tempest overtook our whaling fleet in the winter of 1823.\nIt says Christian fortitude and the generosity of our founding estates preserved Widow's Bight from ruin."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Does it mention the crew?"},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"'The sea received its harvest,' Officer. Chapter Four, page twelve.\nA beautiful sentence. It gives the loss dignity."},{"id":"teacher_founding_1","kind":"notebook","text":"School curriculum teaches the 1823 fleet disaster as a noble sacrifice redeemed by founding estates' charity: 'The sea received its harvest.'"},{"id":"sanitized_textbook","kind":"evidence"}],"tag":"teacher_curriculum","timing":"5"},{"gate":{"left":{"args":["sanitized_textbook"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"args":["reader_omission_letter"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"gate_src":"evidence(sanitized_textbook) AND evidence(reader_omission_letter)","id":"the_drowned_island","label":"Ask whether the children ever ask about the island ruins","line":35,"steps":[{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"Children have foolish fancies. They frighten each other with dares about rowboats."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What do you tell them?"},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"I tell them the island is mud and rotting timbers, and that curious children fall into cisterns."},{"kind":"beat","text":"She pauses, setting her chalk in the wooden groove."},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"The harbor children don't ask, of course. Their parents teach them earlier than I can.\nThey sit in the back row with their slates and never look east out the window. It is remarkably difficult to teach a child who refuses to turn his head toward the sea."},{"id":"teacher_island_1","kind":"notebook","text":"Schoolteacher notes harbor children are taught at home never to look east toward the drowned island: 'They refuse to turn their heads toward the sea.'"},{"id":"harbor_children_discipline","kind":"evidence"}],"tag":"teacher_island","timing":"5"},{"gate":{"left":{"left":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"args":["reader_omission_letter"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"op":"and","right":{"expr":{"args":["schoolteacher","the_slain_boy"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(naomi) AND evidence(reader_omission_letter) AND NOT topic_done(schoolteacher, the_slain_boy)","id":"the_slain_boy","label":"Ask if Naomi's young son ever came to the school","line":48,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Mrs. Almy identified the woman as Naomi Freeman. Did the boy who was with her ever come here?"},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"I remember him. He stood by the gate during morning recess."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did he ask to enter?"},{"kind":"fork","options":[{"label":"Ask about his demeanor.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask about his demeanor."},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"He had a slate of his own. Resoled boots, very neat.\nHe asked me how many years sat between eighteen twenty-three and nineteen twenty-three."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"A century."},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"I told him a hundred. He wrote the number on his slate, rubbed it out with his sleeve, and said his mother was going to collect it today."},{"id":"teacher_boy_slate","kind":"notebook","text":"The murdered boy stood outside the schoolhouse asking about a century's span, saying his mother was going to collect 'it' that day; what he meant was not established."},{"id":"boy_century_slate","kind":"evidence"}]},{"label":"Ask why he wasn't admitted.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask why he wasn't admitted."},{"kind":"line","player":false,"speaker":"MISS HALLOWELL","text":"Our district requires proof of county residence, Officer.\nA tax receipt or an employer's voucher. He had neither.\nI
