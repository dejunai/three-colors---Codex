<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Colors of Madness — NPC Dialogue Tree</title>
<style>
:root {
  --bg: #0d0c0b;
  --surface: #141310;
  --surface2: #1a1816;
  --surface3: #211f1c;
  --border: #2e2b27;
  --text: #ccc9c2;
  --text-muted: #7a7770;
  --text-faint: #4a4845;
  --accent: #b08050;
  --accent-glow: #b08050aa;
  --plain-color: #5fa88a;
  --badge-color: #a85f5f;
  --evidence-color: #8888cc;
  --fork-color: #c9a03a;
  --gate-color: #6a9a6a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Georgia', serif; }

/* HEADER */
header {
  padding: 24px 32px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
header h1 { font-size: 1.1rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: normal; }
header p { font-size: 0.8rem; color: var(--text-muted); font-style: italic; margin-top: 4px; }

.legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-muted); }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.leg-badge { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

/* LAYOUT */
.wrapper { display: flex; height: calc(100vh - 80px); overflow: hidden; }

/* SIDEBAR */
.sidebar {
  width: 260px; min-width: 200px; flex-shrink: 0;
  overflow-y: auto; border-right: 1px solid var(--border);
  background: var(--surface);
  padding: 12px 0;
}
.sidebar::-webkit-scrollbar { width: 5px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.loc-group { margin-bottom: 4px; }
.loc-header {
  padding: 6px 16px; font-size: 0.68rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-faint);
  cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: space-between;
  transition: color 0.15s;
}
.loc-header:hover { color: var(--text-muted); }
.loc-header .arrow { transition: transform 0.2s; }
.loc-group.collapsed .arrow { transform: rotate(-90deg); }
.loc-group.collapsed .loc-npcs { display: none; }

.npc-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 16px 7px 24px; width: 100%; text-align: left;
  background: none; border: none; color: var(--text-muted);
  font-family: inherit; font-size: 0.82rem; cursor: pointer;
  transition: background 0.12s, color 0.12s;
  border-left: 2px solid transparent;
}
.npc-btn:hover { background: var(--surface2); color: var(--text); }
.npc-btn.active { background: var(--surface3); color: var(--text); border-left-color: var(--accent); }
.npc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.topic-count { margin-left: auto; font-size: 0.68rem; color: var(--text-faint); }

/* MAIN PANEL */
.main { flex: 1; overflow-y: auto; padding: 28px 36px; }
.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 60vh; gap: 12px; color: var(--text-faint);
  text-align: center;
}
.placeholder svg { opacity: 0.2; }
.placeholder p { font-size: 0.85rem; font-style: italic; max-width: 320px; line-height: 1.6; }

/* NPC HEADER */
.npc-header {
  display: flex; align-items: flex-start; gap: 16px;
  margin-bottom: 24px; padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.npc-color-bar { width: 4px; flex-shrink: 0; border-radius: 2px; align-self: stretch; min-height: 40px; }
.npc-title { font-size: 1.3rem; color: var(--text); letter-spacing: 0.04em; }
.npc-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; font-style: italic; }
.npc-id { font-size: 0.68rem; color: var(--text-faint); margin-top: 2px; letter-spacing: 0.08em; font-family: 'Courier New', monospace; }

/* TOPIC TREE */
.topic-tree { display: flex; flex-direction: column; gap: 10px; }

.topic-node {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
  transition: border-color 0.15s;
}
.topic-node:hover { border-color: #4a4640; }
.topic-node.has-evidence { border-left: 3px solid var(--evidence-color); }
.topic-node.has-fork { border-left: 3px solid var(--fork-color); }
.topic-node.coat-plain { border-left: 3px solid var(--plain-color); }
.topic-node.coat-badge { border-left: 3px solid var(--badge-color); }
.topic-node.never { opacity: 0.45; border-left: 3px solid var(--text-faint); }

.topic-head {
  padding: 10px 14px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; user-select: none;
}
.topic-name { font-size: 0.88rem; color: var(--text); flex: 1; }
.topic-tag { font-size: 0.68rem; color: var(--text-faint); font-family: 'Courier New', monospace; }
.topic-badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.pill {
  font-size: 0.62rem; padding: 2px 7px; border-radius: 3px;
  font-family: 'Courier New', monospace; letter-spacing: 0.04em; flex-shrink: 0;
}
.pill-plain { background: #1a3028; color: var(--plain-color); border: 1px solid #2a4a3a; }
.pill-badge { background: #301818; color: var(--badge-color); border: 1px solid #4a2828; }
.pill-evidence { background: #1a1a2e; color: var(--evidence-color); border: 1px solid #2a2a4e; }
.pill-gate { background: #1a2a1a; color: var(--gate-color); border: 1px solid #2a3a2a; }
.pill-fork { background: #2e2010; color: var(--fork-color); border: 1px solid #4a3818; }
.pill-never { background: #1a1a1a; color: var(--text-faint); border: 1px solid #2a2a2a; }
.pill-out { background: #1e1e30; color: #9999ee; border: 1px solid #2e2e50; }

.topic-body {
  padding: 0 14px 12px; display: none;
  border-top: 1px solid var(--border);
  font-size: 0.78rem; color: var(--text-muted); line-height: 1.7;
}
.topic-body.open { display: block; }
.topic-body .gate-text { font-style: italic; color: var(--text-faint); margin-bottom: 6px; font-size: 0.75rem; }
.topic-body .ev-label { font-size: 0.72rem; color: var(--evidence-color); margin-top: 8px; }
.ev-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

.toggle-arrow { font-size: 0.7rem; color: var(--text-faint); transition: transform 0.15s; }
.topic-head.open .toggle-arrow { transform: rotate(90deg); }

/* SECTION LABEL */
.section-label {
  font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-faint); margin: 20px 0 8px;
  padding-bottom: 4px; border-bottom: 1px solid var(--border);
}

/* ALL NPCs VIEW */
.all-npc-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px; margin-top: 8px;
}
.npc-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
  border-left: 3px solid transparent;
}
.npc-card:hover { border-color: #4a4640; background: var(--surface3); }
.npc-card-title { font-size: 0.88rem; color: var(--text); }
.npc-card-loc { font-size: 0.7rem; color: var(--text-faint); margin-top: 3px; font-style: italic; }
.npc-card-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; }

/* SEARCH */
.search-bar {
  padding: 8px 16px 0;
}
.search-bar input {
  width: 100%; padding: 6px 10px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-size: 0.78rem; font-family: inherit;
  outline: none;
}
.search-bar input::placeholder { color: var(--text-faint); }
.search-bar input:focus { border-color: var(--accent); }

/* STATS BAR */
.stats-bar {
  display: flex; gap: 20px; flex-wrap: wrap;
  padding: 14px 0 18px; font-size: 0.72rem; color: var(--text-muted);
}
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-n { font-size: 1rem; color: var(--text); }
</style>
</head>

const NPCS = {"almy":{"color":"#8e44ad","label":"Mrs. Almy","location":"boardinghouse","schedule":{},"source":"dialogue/mrs_almy.dialogue","topics":[{"gate":{"left":{"expr":{"args":["almy","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(almy, default) AND coat = plain","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"The coat changes the room before Walter says a word.\nMrs. Almy sets a second cup beside the first."},{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"You came to ask about Naomi.\n\nSit, then. Ask properly."}],"tag":"almy_plain","timing":""},{"gate":{"expr":{"args":["almy","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(almy, default)","id":"default","label":"","line":11,"steps":[{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"If you've come to tell me what the paper says, Officer,\nI have already read it."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I'm asking about the woman and the boy."},{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"The paper wasn't.\n\nWhat is it you intend to write down?"}],"tag":"almy_badge","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"identify","label":"Ask for the woman's name","line":18,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I counted eight people.\nI would like to put a name beside each of them."},{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"Naomi Freeman.\n\nShe ate here. The boy too.\nHe waited for her to begin before touching his own plate."},{"id":"","kind":"notebook","text":"NAOMI FREEMAN.\nIdentified by Mrs. Almy, Pickman Street.\nBoy accompanying her: name still to be established."},{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"You can ask me again tomorrow.\nHer name will still be Naomi."},{"id":"naomi","kind":"evidence"}],"tag":"identify","timing":"4"},{"gate":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(naomi)","id":"lay_lead","label":"Ask what brought Naomi to town","line":29,"steps":[{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"She was looking for something owed.\nA whaler's wages. A share, she called it. A lay.\nFrom her family's time, long before hers."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did you see the document?"},{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"No. She spoke of finding it.\nYou mustn't write that I saw it."},{"id":"","kind":"notebook","text":"Possible wage claim. Document not examined.\nSource: Mrs. Almy's recollection.\n\nA question to pursue.\nNo conclusion about why Naomi died."},{"id":"lay_lead","kind":"evidence"}],"tag":"lay_lead","timing":"4"},{"gate":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(naomi)","id":"service_work","label":"Ask about work at the estate","line":40,"steps":[{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"She asked about work at the estate.\nCleaning, perhaps. They always need someone who can leave by the other door."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Who engaged her?"},{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"I don't know.\nThe steward has books enough.\nAsk him for one that contains her."},{"id":"service_work","kind":"evidence"}],"tag":"service_work","timing":"4"},{"gate":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(naomi)","id":"almy_ledger","label":"Ask to corroborate the visit in her ledger","line":50,"steps":[{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"On the sideboard.\nCopy the entry, if you need it.\nThe book stays here."}],"tag":"almy_ledger","timing":""},{"gate":{"left":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"op":"and","right":{"expr":{"args":["almy","almy_trust"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"coat = plain AND NOT topic_done(almy, almy_trust)","id":"almy_trust","label":"Ask why the coat made a difference","line":56,"steps":[{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"A uniform asks what belongs in a report.\nA man might still ask what happened.\n\nI haven't decided which you are yet."},{"id":"almy_trust_1_1","kind":"notebook","text":"Mrs. Almy distinguished speaking to a uniform from speaking to a man. The name she supplied was the same."}],"tag":"almy_trust","timing":""},{"gate":{"left":{"args":["gazette_correction_printed"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["almy","show_printed_correction"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(gazette_correction_printed) AND NOT topic_done(almy, show_printed_correction)","id":"show_printed_correction","label":"Show her the correction with Naomi's name","line":64,"steps":[{"kind":"beat","text":"Almy reads the narrow slip without sitting down."},{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"They have put her name in it."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"It goes with the copies they haven't sold."},{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"Leave it beside the book a moment."},{"kind":"beat","text":"She lays the slip by the meal ledger, then returns it to Walter."},{"kind":"line","player":false,"speaker":"MRS. ALMY","text":"You brought back something I can read. Thank you."},{"id":"correction_seen","kind":"notebook","text":"Showed Almy the printed correction. She read Naomi's name and set it beside the meal ledger before returning the slip."}],"tag":"almy_printed_correction","timing":"3"}]},"apothecary":{"color":"#27ae60","label":"Mr. Crane (Apothecary)","location":"business_district","schedule":{"evening":"apothecary","midday":"apothecary","morning":"apothecary","night":"closed"},"source":"dialogue/apothecary.dialogue","topics":[{"gate":{"left":{"expr":{"args":["apothecary","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(apothecary, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MR. CRANE","text":"Cough syrups and carbolic soaps on the lower shelf."},{"kind":"beat","text":"He washes a glass pestle in a pan of alcohol with methodical care."},{"kind":"line","player":false,"speaker":"MR. CRANE","text":"If you have a toothache, oil of cloves is ten cents a dram.\nIf it's nerves, chamomile tea is cheaper than tincture of valerian."}],"tag":"apothecary_plain","timing":""},{"gate":{"expr":{"args":["apothecary","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(apothecary, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MR. CRANE","text":"Officer Corwin. I trust the precinct first-aid cabinet is adequately stocked with lint and bandages."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I'm not here for bandages, Mr. Crane."},{"kind":"line","player":false,"speaker":"MR. CRANE","text":"Then please keep your voice down, Officer.\nPatrons in a chemist's shop are entitled to their privacy regarding remedies."}],"tag":"apothecary_badge","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"fenn_laudanum","label":"Inquire about prescriptions filled for Dr. Aldous Fenn","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Dr. Fenn was a physician, but did he purchase pharmaceuticals here?"},{"kind":"line","player":false,"speaker":"MR. CRANE","text":"A physician can prescribe, Officer. He cannot compound bulk spirits on his own parlor rug."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What did he purchase?"},{"kind":"line","player":false,"speaker":"MR. CRANE","text":"Crude gum opium. And grain alcohol in four-gallon carboys.\nHe claimed he was compounding strong sedatives for severe arthritic agitation."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Four gallons of spirits is an excessive quantity for arthritis."},{"kind":"line","player":false,"speaker":"MR. CRANE","text":"Dr. Fenn had forty years of immaculate clinical standing in Miskatonic County, Walter.\nA chemist does not interrogate a senior fellow of the Massachusetts Medical Society regarding quantities."},{"kind":"beat","text":"The chemist lowers his voice, adjusting a blue glass reagent bottle."},{"kind":"line","player":false,"speaker":"MR. CRANE","text":"Though he ceased looking at his patients' eyes three months ago. Only their wrists and ankles.\nHe would press his thumb into the joint and ask them: 'Does the bone feel heavier to you when the tide comes in?'"},{"id":"apothecary_fenn_supplies","kind":"notebook","text":"Apothecary: Fenn bought bulk opium and spirits; stopped looking patients in the eye, only examining wrists and ankles to ask if 'the bone feels heavier when the tide comes in.'"},{"id":"bulk_opium_spirits","kind":"evidence"}],"tag":"apothecary_fenn","timing":"5"},{"gate":{"left":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["apothecary","the_stranger_remedies"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(naomi) AND NOT topic_done(apothecary, the_stranger_remedies)","id":"the_stranger_remedies","label":"Ask if Naomi Freeman sought medicine for her son","line":37,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did the colored woman come to your counter?"},{"kind":"line","player":false,"speaker":"MR. CRANE","text":"She did. The boy had angry red salt-hives along his shins from the weed on the low rocks."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What did she buy?"},{"kind":"line","player":false,"speaker":"MR. CRANE","text":"Carbolic salve and zinc ointment.\nShe counted five copper pennies out of a handkerchief corner."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did she speak of anything else?"},{"kind":"line","player":false,"speaker":"MR. CRANE","text":"She asked if sea water in this bay caused iron to pit faster than in Buzzards Bay.\nI told her salt is salt everywhere along the Atlantic.\nShe looked out the glass toward the point and said, 'Some water has more appetite than others, mister.'"},{"id":"apothecary_naomi_salve","kind":"notebook","text":"Naomi bought carbolic salve for her son's salt-hives; observed that Widow's Bight seawater seemed to corrode iron unnaturally fast."},{"id":"water_corrosion_inquiry","kind":"evidence"}],"tag":"apothecary_naomi","timing":"5"}]},"assistant":{"color":"#c0392b","label":"Coroner's Assistant","location":"estate","schedule":{},"source":"dialogue/coroners_assistant.dialogue","topics":[{"gate":{"op":"lit","value":true},"gate_src":"always","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"THE CORONER'S ASSISTANT","text":"I've counted them twice. Eight.\n\nThe captain wants the identified men prepared first."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Any sign of an explosion?"},{"kind":"line","player":false,"speaker":"THE CORONER'S ASSISTANT","text":"None I can find. No burns. No broken glass.\n\nI can't tell you what happened. I can tell you what isn't here."},{"kind":"line","player":false,"speaker":"A CLEAN READ","text":"Two independent observations agree.\nFor a moment the work is simple.\n\nWalter knows what to ask next."},{"id":"testimony","kind":"evidence"},{"id":"eight","kind":"evidence"}],"tag":"assistant","timing":"5"}]},"boy":{"color":"#c0392b","label":"Gatehouse Boy","location":"estate","schedule":{},"source":"dialogue/gatehouse_boy.dialogue","topics":[{"gate":{"args":[],"call":false,"cmp":"","name":"estate_complete","op":"cmp","value":null},"gate_src":"estate_complete","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"THE GATEHOUSE BOY","text":"The wagon's been and gone. The captain and the coroner's man went right with the bodies."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And the gardener?"},{"kind":"line","player":false,"speaker":"THE GATEHOUSE BOY","text":"Over yonder, just beside the drive below the hedge. He's back at his work."}],"tag":"boy_return","timing":""},{"gate":{"args":["boy"],"call":true,"cmp":">=","name":"visit_count","op":"cmp","value":"2"},"gate_src":"visit_count(boy) >= 2","id":"default","label":"","line":12,"steps":[{"kind":"line","player":false,"speaker":"THE GATEHOUSE BOY","text":"Through the gap in the hedge. The captain's still on the terrace."}],"tag":"boy_repeat","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"default","label":"","line":17,"steps":[{"kind":"line","player":false,"speaker":"THE GATEHOUSE BOY","text":"THEY'RE IN THE ROSE GARDEN, OFFICER.\nWHAT'S LEFT OF THEM."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Who found them?"},{"kind":"line","player":false,"speaker":"THE GATEHOUSE BOY","text":"The gardener. He sent me for the police.\n\nStraight up the drive. Through the opening in the hedge.\nThe captain is waiting on the terrace."}],"tag":"boy","timing":"4"}]},"chandlers_boy":{"color":"#608060","label":"Chandlers Boy","location":"waterfront","schedule":{"evening":"closed","midday":"waterfront_chandlery","morning":"waterfront_chandlery","night":"closed"},"source":"dialogue/chandlers_boy.dialogue","topics":[{"gate":{"left":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"op":"and","right":{"args":["chandlers_boy"],"call":true,"cmp":">=","name":"visit_count","op":"cmp","value":"2"}},"gate_src":"coat = plain AND visit_count(chandlers_boy) >= 2","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"CHANDLER'S BOY","text":"Back again, sir? Mr. Hitch is in the cellar tallying casks."}],"tag":"chandlers_boy_plain_repeat","timing":"0"},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"default","label":"","line":11,"steps":[{"kind":"line","player":false,"speaker":"CHANDLER'S BOY","text":"We've got sperm oil, colza, and tallow.\nMr. Hitch says the colza's best for reading lamps but everyone buys the tallow anyway."}],"tag":"chandlers_boy_default","timing":"2"},{"gate":{"left":{"args":["chandlers_boy"],"call":true,"cmp":">=","name":"visit_count","op":"cmp","value":"2"},"op":"and","right":{"expr":{"args":["chandlers_boy","lamp_question"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"visit_count(chandlers_boy) >= 2 AND NOT topic_done(chandlers_boy, lamp_question)","id":"lamp_question","label":"Ask about the chandlery's customers","line":17,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Who keeps the largest order standing?"},{"kind":"line","player":false,"speaker":"CHANDLER'S BOY","text":"The estate takes six crates of sperm oil a month.\nMr. Hitch says it's for the reading room but I've seen the invoices.\nThat's enough for every room in the house to burn all night."},{"kind":"beat","text":"He glances toward the back room, then lowers his voice."},{"kind":"line","player":false,"speaker":"CHANDLER'S BOY","text":"Last month they ordered an extra four crates.\nMr. Hitch said not to note it separately.\nSo I didn't."},{"id":"chandlers_boy_lamp","kind":"notebook","text":"The chandler's boy mentioned the estate's standing oil order increased by four crates last month. He was instructed not to record it separately."}],"tag":"chandlers_boy_lamp_question","timing":"3"},{"gate":{"left":{"left":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"op":"and","right":{"args":["naomi_quay_inquiry"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"op":"and","right":{"expr":{"args":["chandlers_boy","island_delivery"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"coat = plain AND evidence(naomi_quay_inquiry) AND NOT topic_done(chandlers_boy, island_delivery)","id":"island_delivery","label":"Ask if oil was ever delivered to the island station","line":29,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Has anyone ever ordered a delivery out to the old whaling station? On the island."},{"kind":"beat","text":"A long pause. He straightens the lamp wicks on the counter without looking up."},{"kind":"line","player":false,"speaker":"CHANDLER'S BOY","text":"Not to the island. I've never loaded anything for there.\nThere was a cash buyer at the yard entrance, maybe eight weeks ago.\nHe paid Mr. Hitch directly, not on account."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Where was his purchase going?"},{"kind":"line","player":false,"speaker":"CHANDLER'S BOY","text":"He didn't say. I didn't see it leave the yard."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What did he take?"},{"kind":"line","player":false,"speaker":"CHANDLER'S BOY","text":"Two crates sperm oil and a box of long tapers.\nThe good ones, not the household grade.\nMr. Hitch told me it was a private matter and I should finish sweeping."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Can you describe the man?"},{"kind":"line","player":false,"speaker":"CHANDLER'S BOY","text":"Tall. Good coat. He didn't look at me once."},{"id":"chandlers_boy_island","kind":"notebook","text":"A man in a good coat made a cash purchase at the chandlery yard eight weeks ago — two crates of sperm oil and long tapers, not household grade. The transaction was not entered on account. Its destination is unknown; the boy reports no island delivery."},{"id":"chandlery_island_delivery","kind":"evidence"}],"tag":"chandlers_boy_island_delivery","timing":"6"},{"gate":{"left":{"args":["chandlery_island_delivery"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["chandlers_boy","cash_buyer_details"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(chandlery_island_delivery) AND NOT topic_done(chandlers_boy, cash_buyer_details)","id":"cash_buyer_details","label":"Ask what else he noticed about the cash buyer","line":46,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The tall man in the good coat. Did you smell anything on him?"},{"kind":"line","player":false,"speaker":"CHANDLER'S BOY","text":"Cedar shavings. Very sharp, like a chest that's been locked up in an attic for fifty years.\nAnd camphor."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Like the apothecary's camphor?"},{"kind":"line","player":false,"speaker":"CHANDLER'S BOY","text":"Stronger. Like the parcels that come off foreign barks at the quay. He set the money down in five-dollar gold eagles, minted before the war."},{"id":"chandlers_boy_buyer_1","kind":"notebook","text":"Chandler's boy notes the cash buyer smelled of cedar and heavy foreign camphor, paying with pre-war gold coin."},{"id":"cedar_camphor_buyer","kind":"evidence"}],"tag":"chandlers_boy_buyer","timing":"4"}]},"clockmaker":{"color":"#27ae60","label":"Mr. Vane (Clockmaker)","location":"business_district","schedule":{"evening":"repairer","midday":"repairer","morning":"repairer","night":"closed"},"source":"dialogue/clockmaker.dialogue","topics":[{"gate":{"left":{"expr":{"args":["clockmaker","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(clockmaker, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MR. VANE","text":"Do not touch the regulator on the wall."},{"kind":"beat","text":"The watchmaker works with an eyeglass screwed into his right orbit, tweezers poised over an open brass movement."},{"kind":"line","player":false,"speaker":"MR. VANE","text":"The pendulum is calibrated to county mean time. If you have an uncoiled mainspring, set it in the tin dish by the lamp."}],"tag":"clockmaker_plain","timing":""},{"gate":{"expr":{"args":["clockmaker","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(clockmaker, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MR. VANE","text":"Officer Corwin. I told Captain Odell two years ago that the precinct hall clock gains four minutes a week because of the coal stove beneath it."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I'm not here about the hall clock, Mr. Vane."},{"kind":"line","player":false,"speaker":"MR. VANE","text":"Then state your gear, Officer. A balance wheel waits for no man."}],"tag":"clockmaker_badge","timing":""},{"gate":{"args":["watch"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(watch)","id":"the_stopped_watch","label":"Show him the pocket watch stopped at seventeen past three","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"A gold pocket watch. Found on a body in the rose garden.\nHands stopped at precisely 3:17."},{"kind":"beat","text":"Mr. Vane takes the watch with jeweler's tissue, turns it under the magnifier, and taps the balance cock."},{"kind":"line","player":false,"speaker":"MR. VANE","text":"English lever movement. London hallmark, circa 1840. The mainspring is fully wound."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Then why did it stop?"},{"kind":"line","player":false,"speaker":"MR. VANE","text":"The balance staff didn't break, Walter. The hairspring fused."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Fused?"},{"kind":"line","player":false,"speaker":"MR. VANE","text":"The blued steel coils appear joined at three points. I can show you under the glass. I cannot tell you what joined them."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Does that tell you when it stopped?"},{"kind":"line","player":false,"speaker":"MR. VANE","text":"It tells me why it cannot run now. The hands are not a certificate of the hour it failed."},{"kind":"beat","text":"He pauses, looking up from the loupe with pale, watering eyes."},{"kind":"line","player":false,"speaker":"MR. VANE","text":"Though if you want an hour, ask why Judge Wexford, Mr. Corliss, and Dr. Fenn brought me their watches last Thursday."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"To be cleaned?"},{"kind":"line","player":false,"speaker":"MR. VANE","text":"To have the second hands removed. Plucked out with tweezers and left in my scrap bin.\nThree men on the same afternoon. They said the jumping of the hand made their parlors too loud."},{"id":"clockmaker_watch_1","kind":"notebook","text":"Vane showed fused hairspring in the stopped watch. Revealed Wexford, Corliss, and Fenn had their watches' second hands removed last Thursday: 'the jumping of the hand made their parlors too loud.'"},{"id":"fused_hairspring_anomaly","kind":"evidence"}],"tag":"clockmaker_watch","timing":"8"},{"gate":{"args":["watch"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(watch)","id":"tryworks_instruments","label":"Ask about old navigational instruments from the fleet","line":42,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Do you ever see brass work from the 1823 whaling fleet?"},{"kind":"line","player":false,"speaker":"MR. VANE","text":"The Ophion carried sextants by Troughton of London. Very fine brass, hand-divided silver arcs."},{"kind":"beat","text":"He sets down his tweezers and removes the loupe."},{"kind":"line","player":false,"speaker":"MR. VANE","text":"A laborer brought me a vernier index two seasons back. Found in the silt off the point.\nHe asked me to polish the verdigris off."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did you?"},{"kind":"line","player":false,"speaker":"MR. VANE","text":"The acid wouldn't touch it. Salt water leaves green crust, Walter. This was dark grey, slick as oil, and smelled of sulphur.\nI gave it back to him. Some metals have had enough done to them."},{"id":"clockmaker_instruments_1","kind":"notebook","text":"Watchmaker examined a fleet vernier index from the silt: coated in dark, acid-resistant grey patina that smelled of sulphur."},{"id":"tryworks_metal_patina","kind":"evidence"}],"tag":"clockmaker_maritime","timing":"6"}]},"county_clerk":{"color":"#27ae60","label":"Mr. Pence (County Clerk)","location":"town_hall","schedule":{"evening":"closed","midday":"registrar","morning":"registrar","night":"closed"},"source":"dialogue/county_clerk.dialogue","topics":[{"gate":{"left":{"expr":{"args":["county_clerk","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(county_clerk, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MR. PENCE","text":"Public inspection hours end at four."},{"kind":"beat","text":"He moistens a fingertip on a porcelain sponge tray and turns a ledger leaf."},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"If this is genealogical, the fee is twenty cents per volume.\nIf this is municipal, state the parcel."}],"tag":"clerk_plain","timing":""},{"gate":{"expr":{"args":["county_clerk","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(county_clerk, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MR. PENCE","text":"Officer Corwin. Captain Odell sent over the preliminary notices this morning."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did he send the full list?"},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"He sent six notices of sudden decease for probate indexing.\nThe forms are standard."}],"tag":"clerk_badge","timing":""},{"gate":{"left":{"left":{"args":["lay_lead"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"args":["new_bedford_letters"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"op":"and","right":{"args":["postal_bureaucracy_refusal"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"gate_src":"evidence(lay_lead) AND evidence(new_bedford_letters) AND evidence(postal_bureaucracy_refusal)","id":"wage_claim_inquiry","label":"Attempt to file Naomi Freeman's wage claim","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I want to record an unpaid whaler's lay. Naomi Freeman, on behalf of an ancestor aboard the Ophion."},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"You'd need a living claimant. A next of kin with legal standing."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The mother is dead. The boy found with her is dead."},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"Then the claim abates. An estate requires an administrator appointed by probate, and Judge Wexford's seat is vacant, as you know."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"There is another child. A boy, six years old, kept at a mission in New Bedford. Surviving."},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"Who stands as his guardian?"},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"No one of record. The mission, as far as I can tell."},{"kind":"beat","text":"Mr. Pence sets his dry pen into the brass stand without looking up."},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"Then you have brought me no claimant at all, Officer.\nA minor cannot tender his own affidavit, and no guardian of record stands to tender it for him."},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"Find a guardian appointed to stand for him, or the claim has no one to belong to."},{"kind":"fork","options":[{"label":"Ask what becomes of a debt with no claimant to stand for it.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask what becomes of a debt with no claimant to stand for it."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"So a debt simply evaporates because a six-year-old can't sign for it?"},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"It does not evaporate, Corwin. It abates.\nA minor cannot stand for himself, and until someone is appointed to stand for him, that is the nature of the statute, not a flaw in it."},{"id":"clerk_claim_minor","kind":"notebook","text":"Registrar: a wage claim requires a living claimant able to stand for himself, or a guardian appointed to stand for him. Naomi's surviving son is a minor at a New Bedford mission with no guardian of record; the claim has no one to stand for it."},{"id":"claim_no_claimant","kind":"evidence"}]},{"label":"Insist on filing in triplicate under police authority.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Insist on filing in triplicate under police authority."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Enter the claim in triplicate under my name as reporting officer, to preserve the record until a guardian is appointed."},{"kind":"beat","text":"Mr. Pence looks up over wire spectacles, pen poised."},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"I will stamp it as received correspondence, Officer.\nIt sits in the dead-records drawer. It creates no lien, and twenty years from now nobody will look in that drawer."},{"id":"clerk_claim_triplicate","kind":"notebook","text":"Wage claim submitted in triplicate as police correspondence to preserve the record for Naomi's surviving son, a minor with no guardian of record; filed inertly in county dead-records drawer."},{"id":"claim_filed_inert","kind":"evidence"}]}]}],"tag":"clerk_wage_claim","timing":"10"},{"gate":{"left":{"args":["behan_name"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"or","right":{"args":["ophion_myth_classical"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"gate_src":"evidence(behan_name) OR evidence(ophion_myth_classical)","id":"ophion_settlement","label":"Request the 1820s Ophion insurance and probate filings","line":49,"steps":[{"kind":"line","player":false,"speaker":"MR. PENCE","text":"Volume 14, Maritime Disbursements and Marine Underwriting, 1823–1828."},{"kind":"beat","text":"He pulls a heavy sheepskin-bound folio with flaking spine."},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"Underwriters' draft paid out to Pruitt, Corliss, and Wexford syndicates. Eighty-four thousand dollars in gold specie."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And the crew's families?"},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"Noted as 'Lost at sea; accounts closed by total abandonment.' No lay shares were distributed."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The same families bought the harbor mills eighteen months later."},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"The ledger notes transactions, Officer. It does not pass moral judgments on timing."},{"id":"clerk_ophion_1","kind":"notebook","text":"1820s probate records: $84,000 insurance paid to Pruitt/Corliss/Wexford syndicates. Crew accounts closed as total loss; zero lays paid."},{"id":"insurance_fraud_record","kind":"evidence"}],"tag":"clerk_ophion_records","timing":"5"},{"gate":{"op":"lit","value":false},"gate_src":"never","id":"sixth_member_deed","label":"Check deeds and tax rolls for the Ophion Club property","line":64,"steps":[{"kind":"line","player":false,"speaker":"MR. PENCE","text":"The estate deed is held in trust. Six shares of tenancy in common."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Name the shareholders."},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"Absalom Wexford. Aldous Fenn. Miles Corliss. Josiah Pruitt. Otto Kessler."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"That is five."},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"The sixth share is recorded simply as 'The Overseer of the Line.' No individual surname registered since the 1850 re-charter."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"How does an unnameable title pay property tax?"},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"The check arrives drawn on the Boston Marine Bank. It clears. The county does not return legal currency."},{"id":"clerk_sixth_man_1","kind":"notebook","text":"The sixth Ophion Club share is deeded to 'The Overseer of the Line' without personal name; taxes paid via Boston Marine Bank."},{"id":"overseer_deed","kind":"evidence"}],"tag":"clerk_sixth_man","timing":"5"},{"gate":{"left":{"args":["local_historian","crew_omission_official"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["county_clerk","crew_omission"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"topic_done(local_historian, crew_omission_official) AND NOT topic_done(county_clerk, crew_omission)","id":"crew_omission","label":"Ask why the town's history leaves out the crew's names","line":82,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Why does the town's history leave out the crew's names?"},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"Crew names belong in a shipping list, Officer. This is a county office."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I asked why the town's account leaves them out."},{"kind":"line","player":false,"speaker":"MR. PENCE","text":"Then ask whoever composed the account. I certify records. I do not improve them."},{"id":"crew_omission_refusal","kind":"notebook","text":"Asked Mr. Pence why the crew's names are missing from the town's history. No explanation supplied; the question remains open."}],"tag":"county_clerk_crew_omission","timing":"3"}]},"crew":{"color":"#c0392b","label":"Groundskeeper","location":"estate","schedule":{},"source":"dialogue/groundskeeper.dialogue","topics":[{"gate":{"op":"lit","value":true},"gate_src":"always","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"THE KITCHEN WING YARD","text":"A groundskeeper stacks crates beside a banked fire, working fast in the cold. The service door stands a few feet off. He never sets a crate nearer to it than the last."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Something wrong with the door?"},{"kind":"line","player":false,"speaker":"THE GROUNDSKEEPER","text":"Uneven step. Easy to turn an ankle in this light.\n\nMind the same on your way out."},{"kind":"line","player":false,"speaker":"WALTER'S NOTEBOOK","text":"The distance he keeps is exact, not nervous. He named a reason before Walter asked for one, then went back to the crates without slowing down.\n\nThe observation is exact. The reason he gave may not be."},{"id":"crew","kind":"evidence"}],"tag":"crew","timing":""},{"gate":{"left":{"args":["crew"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["crew","perimeter_trench"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(crew) AND NOT topic_done(crew, perimeter_trench)","id":"perimeter_trench","label":"Ask about the white powder trenched into the soil thirty paces from the door","line":14,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"There's a shallow furrow scored into the dirt thirty paces back from the kitchen door. Ground oyster shell and yellow brimstone."},{"kind":"beat","text":"The groundskeeper drops a crate onto the stack with a sharp, hollow hollow clatter."},{"kind":"line","player":false,"speaker":"THE GROUNDSKEEPER","text":"Grange orders. Slugs in the rhododendrons."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Slugs don't cross thirty yards of open carriage gravel in November."},{"kind":"line","player":false,"speaker":"THE GROUNDSKEEPER","text":"They don't cross that line either, Officer. That's why it's there.\nNow step back on the gravel path. You're kicking the lime into the grass."},{"id":"groundskeeper_perimeter_line","kind":"notebook","text":"A furrow packed with crushed oyster shell and brimstone sulfur rings the kitchen yard thirty paces out. Groundskeeper claimed it was for garden slugs, but insisted Walter not disturb the boundary."},{"id":"sulfur_shell_perimeter","kind":"evidence"}],"tag":"groundskeeper_perimeter","timing":"4"}]},"eleanor_whitlock":{"color":"#d35400","label":"Mrs. Whitlock","location":"upper_residential_ridge","schedule":{"dawn":"{chapel_path}","evening":"{charity_hall}","midday":"{whitlock_orangery}"},"source":"dialogue/mrs_whitlock.dialogue","topics":[{"gate":{"expr":{"args":["eleanor_whitlock","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(eleanor_whitlock, default)","id":"default","label":"","line":8,"steps":[{"kind":"line","player":false,"speaker":"MRS. WHITLOCK","text":"If this concerns the garden party, Officer, I assure you the roses are innocent."}],"tag":"","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"charity","label":"Ask about charitable work","line":12,"steps":[{"kind":"line","player":false,"speaker":"MRS. WHITLOCK","text":"Most people require help before they require dignity."},{"kind":"line","player":false,"speaker":"MRS. WHITLOCK","text":"The trouble is that institutions often provide one only after taking the other."}],"tag":"whitlock_charity","timing":""},{"gate":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(naomi)","id":"strangers","label":"Ask about newcomers","line":19,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did you notice a woman traveling with a young boy?"},{"kind":"line","player":false,"speaker":"MRS. WHITLOCK","text":"Yes."},{"kind":"line","player":false,"speaker":"MRS. WHITLOCK","text":"People always notice strangers."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Then why does nobody seem to remember them?"},{"kind":"line","player":false,"speaker":"MRS. WHITLOCK","text":"Remembering and noticing are different acts."}],"tag":"whitlock_strangers","timing":""},{"gate":{"left":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["eleanor_whitlock","names"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(naomi) AND NOT topic_done(eleanor_whitlock, names)","id":"names","label":"Ask why names matter","line":29,"steps":[{"kind":"line","player":false,"speaker":"MRS. WHITLOCK","text":"A town can misplace a person more easily than a name."},{"id":"whitlock_names_1","kind":"notebook","text":"The distinction between an unnamed victim and a named victim remains central to the case."}],"tag":"whitlock_names","timing":""}]},"father_behan":{"color":"#2c3e50","label":"Father Behan","location":"town","schedule":{},"source":"dialogue/father_behan.dialogue","topics":[{"gate":{"expr":{"args":["father_behan","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(father_behan, default)","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"FATHER BEHAN","text":"Wexford's temper. Fenn's vanity. Kessler's grudges. Corliss's ambitions.\n\nI'll discuss any of it. None of it explains a hole above the bridge of a nose."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"You knew all six."},{"kind":"line","player":false,"speaker":"FATHER BEHAN","text":"I knew what men tell a priest, which is not the same as what they are.\n\nAsk your question, Officer. I've answered worse."},{"id":"introduction","kind":"notebook","text":"Father Behan discussed five of the men's characters freely and himself not at all."}],"tag":"behan","timing":"4"},{"gate":{"expr":{"args":["father_behan","club_invitation"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(father_behan, club_invitation)","id":"club_invitation","label":"Ask why he declined the club's invitations","line":14,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"You were invited to the club. Twice. You declined both times."},{"kind":"line","player":false,"speaker":"FATHER BEHAN","text":"I did."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Why?"},{"kind":"line","player":false,"speaker":"FATHER BEHAN","text":"[He says nothing further. The silence is not evasive. It is final.]"},{"id":"","kind":"notebook","text":"A refusal offered without excuse.\nWalter has learned to trust a plain no more than a decorated one.\n\nHe does not press it a second time."},{"id":"club_invitation_1_1","kind":"notebook","text":"Father Behan declined two invitations to the club and would not say why."}],"tag":"behan_invitation","timing":"5"},{"gate":{"args":["father_behan","club_invitation"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"gate_src":"topic_done(father_behan, club_invitation)","id":"behan_name","label":"Ask about the meaning of the club's name","line":26,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Do you know the meaning behind the club's name?"},{"kind":"line","player":false,"speaker":"FATHER BEHAN","text":"They named the club after the ship."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Known."},{"kind":"line","player":false,"speaker":"FATHER BEHAN","text":"They came to believe the ship had been chosen.\n\nIt wasn't. Men inherit money, and then invent a reason they deserved it."},{"id":"","kind":"notebook","text":"A shipowner's classical flourish, nothing more, by the priest's own account.\n\nThe club's fortune has a human explanation. Walter intends to find it."},{"id":"behan_name","kind":"evidence"}],"tag":"behan_name","timing":"5"},{"gate":{"op":"lit","value":false},"gate_src":"never","id":"sixth_man","label":"","line":38,"steps":[],"tag":"","timing":""}]},"gardener":{"color":"#c0392b","label":"Gardener","location":"estate","schedule":{},"source":"dialogue/gardener.dialogue","topics":[{"gate":{"left":{"args":[],"call":false,"cmp":"","name":"estate_complete","op":"cmp","value":null},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"estate_complete AND coat = plain","id":"default","label":"","line":5,"steps":[{"kind":"line","player":false,"speaker":"THE GARDENER","text":"You took the badge off."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I'm still asking."},{"kind":"line","player":false,"speaker":"THE GARDENER","text":"Then write this down as well. I saw the woman here before. Walking to the service door.\n\nI don't know her name. The steward might.\nAsk him as though an answer is required."},{"id":"service_door","kind":"notebook","text":"The gardener saw the woman at the service door. Ask the steward."}],"tag":"gardener_plain","timing":"3"},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"THE GARDENER","text":"I keep the roses. I don't keep the hours of the men who walk among them."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"You found both scenes?"},{"kind":"line","player":false,"speaker":"THE GARDENER","text":"Yes.\n\nI sent for eight sheets.\nThey brought six the first time."},{"id":"eight_sheets","kind":"notebook","text":"The gardener requested eight sheets. Six arrived first."}],"tag":"gardener","timing":"3"}]},"gazette_editor":{"color":"#27ae60","label":"Mr. Halleck (Editor)","location":"business_district","schedule":{"evening":"tavern","midday":"printer","morning":"printer","night":"home"},"source":"dialogue/gazette_editor.dialogue","topics":[{"gate":{"left":{"expr":{"args":["gazette_editor","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(gazette_editor, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"We're setting type for Friday's evening run."},{"kind":"beat","text":"The editor glances up from a tray of lead slugs, wiping ink from his knuckles."},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"If you have a business notice, give it to the boy at the front desk.\nIf you're here about the editorial on harbor dredging, save your breath."}],"tag":"editor_plain","timing":""},{"gate":{"expr":{"args":["gazette_editor","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(gazette_editor, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"Officer Corwin. I saw your captain's dispatch on the club deaths."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Did Odell tell you what to print?"},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"Captain Odell doesn't edit this paper, Officer.\nHe merely provides the facts the municipality is prepared to vouch for."}],"tag":"editor_badge","timing":""},{"gate":{"left":{"args":["eight"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["gazette_correction_printed"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(eight) AND NOT evidence(gazette_correction_printed)","id":"the_omitted_two","label":"Confront him about omitting the mother and boy","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Your morning edition reports six dead in a gas-main mishap.\nEight people died in that garden."},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"Six subscribers died, Officer. Six prominent civic trustees whose obituaries take half a page each."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"And the woman thirty yards away?"},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"A colored woman and a minor with no local address, no coroner's identification, and no estate in probate.\nWhat headline would you have me set? 'Transients Perish Near Club'?"},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"They were murdered."},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"A word like murder requires an indictment. A D.A.'s signature.\nOur District Attorney is currently lying on a marble slab in the precinct cellar."},{"id":"editor_omitted_1","kind":"notebook","text":"Miskatonic Gazette editor defended omitting the woman and boy from the reported count: 'Six subscribers died... A word like murder requires an indictment.'"},{"id":"press_suppression","kind":"evidence"}],"tag":"editor_omitted","timing":"5"},{"gate":{"left":{"left":{"args":["press_suppression"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"args":["lay_lead"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"op":"and","right":{"expr":{"args":["gazette_correction_printed"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(press_suppression) AND evidence(lay_lead) AND NOT evidence(gazette_correction_printed)","id":"press_the_arithmetic","label":"Demand an honest retraction","line":35,"steps":[{"kind":"fork","options":[{"label":"Threaten to name advertisers connected to the club.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Threaten to name advertisers connected to the club."},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"Go right ahead, Corwin."},{"kind":"beat","text":"He sets a heavy composing stick down on the marble imposing table with a flat clatter."},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"Josiah Pruitt owns the mortgage on this building. Corliss's firm writes our libel insurance.\nI have eleven men working those flatbed presses who have children to feed on Saturday. That isn't conspiracy. That's arithmetic."},{"id":"editor_mortgage","kind":"notebook","text":"Pruitt and Corliss held the Gazette's building mortgage and libel bond; the paper cannot print allegations against the club."},{"id":"gazette_leverage","kind":"evidence"}]},{"label":"Describe Almy's account of the wage inquiry.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Describe Almy's account of the wage inquiry."},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"A hundred-year-old whaler's claim from before the Civil War?"},{"kind":"beat","text":"He shakes his head, lighting a stub of a cigar."},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"Nobody in Miskatonic County buys a newspaper to read about century-old whaling debt.\nThey buy it to know which bank is solvent."},{"id":"editor_lay_dismissed","kind":"notebook","text":"Gazette editor refused the Freeman wage claim as ancient history unsuited for news print."},{"id":"lay_publicity_refused","kind":"evidence"}]}]}],"tag":"editor_arithmetic","timing":"6"},{"gate":{"left":{"args":["press_suppression"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["gazette_editor","gas_main_origin"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(press_suppression) AND NOT topic_done(gazette_editor, gas_main_origin)","id":"gas_main_origin","label":"Ask who suggested the 'gas-main' story","line":54,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Who gave you 'gas-main tragedy'?"},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"Dr. Fenn's junior associate called before dawn, before the wagon even finished loading."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Before the coroner opened a skull."},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"He said an accidental expansion of foul air in the lower conduit caused sudden asphyxia.\nIt sounded Latin. It sounded respectable. It filled the column."},{"id":"editor_gas_origin_1","kind":"notebook","text":"Dr. Fenn's associate phoned the 'gas-main/foul air' explanation to the Gazette before dawn, prior to any autopsy."},{"id":"fabricated_foul_air","kind":"evidence"}],"tag":"editor_gas_source","timing":"4"},{"gate":{"left":{"args":["local_historian","crew_omission_official"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"and","right":{"expr":{"args":["gazette_editor","crew_omission"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"topic_done(local_historian, crew_omission_official) AND NOT topic_done(gazette_editor, crew_omission)","id":"crew_omission","label":"Ask why the town's history leaves out the crew's names","line":67,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Why does the town's history leave out the crew's names?"},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"A commemorative column is not a passenger manifest."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"They were the crew. Why leave their names out?"},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"Because a column has a bottom, Corwin. Take your complaint to the Historical Society."},{"id":"crew_omission_refusal","kind":"notebook","text":"Asked Mr. Halleck why the crew's names are missing from the town's history. No explanation supplied; the question remains open."}],"tag":"gazette_editor_crew_omission","timing":"3"},{"gate":{"left":{"left":{"args":["press_suppression"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"args":["naomi"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"op":"and","right":{"expr":{"args":["gazette_editor","correction_terms"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(press_suppression) AND evidence(naomi) AND NOT topic_done(gazette_editor, correction_terms)","id":"correction_terms","label":"Ask what he needs to correct the count and print Naomi's name","line":79,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Mrs. Almy identifies the woman as Naomi Freeman. Will you print her name beside the count?"},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"Her word, and what else?"},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"She keeps a meal ledger."},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"Then copy the entry. Put the identification and its source into a report the precinct has received. Bring those pages back."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"You would print eight?"},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"As the number in your received report. No murder weapon, no culprit, no sermon. A correction with a source."},{"id":"correction_terms","kind":"notebook","text":"Halleck will consider a sourced correction: eight deaths, Almy's identification of Naomi, and her meal-ledger entry must be in received report pages. Copy the ledger at the boardinghouse, file any later discoveries as a precinct supplement, then return to the editor."},{"id":"gazette_correction_terms","kind":"evidence"}],"tag":"editor_correction_terms","timing":"4"},{"gate":{"left":{"left":{"args":["gazette_correction_terms"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"expr":{"left":{"left":{"args":["eight"],"call":true,"cmp":"","name":"filed","op":"cmp","value":null},"op":"and","right":{"args":["naomi"],"call":true,"cmp":"","name":"filed","op":"cmp","value":null}},"op":"and","right":{"args":["lodging"],"call":true,"cmp":"","name":"filed","op":"cmp","value":null}},"op":"not"}},"op":"and","right":{"expr":{"args":["gazette_editor","correction_pending"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(gazette_correction_terms) AND NOT (filed(eight) AND filed(naomi) AND filed(lodging)) AND NOT topic_done(gazette_editor, correction_pending)","id":"correction_pending","label":"Ask whether the correction can go ahead yet","line":93,"steps":[{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"The count, the identification, and the ledger entry, Corwin. All in received pages. Your notebook is yours; it is not the precinct's receipt."},{"id":"correction_pending","kind":"notebook","text":"Halleck still requires the count and both identification sources in received paperwork. A discovery made after filing needs a dated supplement."}],"tag":"editor_correction_pending","timing":"0"},{"gate":{"left":{"left":{"left":{"left":{"args":["gazette_correction_terms"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"args":["eight"],"call":true,"cmp":"","name":"filed","op":"cmp","value":null}},"op":"and","right":{"args":["naomi"],"call":true,"cmp":"","name":"filed","op":"cmp","value":null}},"op":"and","right":{"args":["lodging"],"call":true,"cmp":"","name":"filed","op":"cmp","value":null}},"op":"and","right":{"expr":{"args":["gazette_editor","print_correction"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(gazette_correction_terms) AND filed(eight) AND filed(naomi) AND filed(lodging) AND NOT topic_done(gazette_editor, print_correction)","id":"print_correction","label":"Lay out the received pages and request the correction","line":101,"steps":[{"kind":"beat","text":"Halleck lays the received pages side by side. His finger stops on the entry from Almy's book."},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"The first heading remains six."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Read the pages underneath it."},{"kind":"beat","text":"He turns the page. Then he draws a rule across a scrap of copy paper."},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"Eight reported deaths. Naomi Freeman, identified by the boardinghouse keeper and her meal record. Cause unestablished. That is what these pages support."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Print that."},{"kind":"beat","text":"The small proof press gives a dry knock. Halleck sets a narrow correction slip beside the morning paper."},{"kind":"line","player":false,"speaker":"THE GAZETTE — CORRECTION","text":"The received police report records eight deaths at the Ophion estate. Mrs. Almy identifies the woman as Naomi Freeman; her meal ledger corroborates the account. The boy's name remains unestablished. No cause has been established in the report."},{"kind":"line","player":false,"speaker":"MR. HALLECK","text":"This goes with the copies still on the counter. I can't call back the ones already sold."},{"id":"printed_correction","kind":"notebook","text":"Collected a printed Gazette correction slip: eight reported deaths; Naomi Freeman identified by Almy and corroborated by her ledger; boy unnamed and cause unestablished. It accompanies unsold copies. The original six-person edition and captain's heading remain unchanged."},{"id":"gazette_correction_printed","kind":"evidence"}],"tag":"editor_print_correction","timing":"8"}]},"harbor_observer":{"color":"#2980b9","label":"Harbor Mason","location":"waterfront","schedule":{"evening":"lower_house_3","midday":"quay_repair","morning":"quay_repair","night":"lower_house_3"},"source":"dialogue/harbor_observer.dialogue","topics":[{"gate":{"expr":{"args":["harbor_observer","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(harbor_observer, default)","id":"default","label":"","line":7,"steps":[{"kind":"beat","text":"The laborer chips mortar from a sea-wall block with a cold chisel, his ring flashing dull umber in the salt air."},{"kind":"beat","text":"He does not look up when Walter stops beside the staging."},{"kind":"line","player":false,"speaker":"MASON","text":"High water comes at quarter past five.\nIf you're going to stand on that timber, watch your step."}],"tag":"observer_default","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"estate_grounds_crew","label":"Ask about the laborers who work the Ophion grounds","line":14,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The men who tend the hedges near the kitchen wing at the estate.\nThey come from down here."},{"kind":"line","player":false,"speaker":"MASON","text":"Harbor people work where there's coin."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"None of them would go within thirty feet of the pantry door."},{"kind":"beat","text":"The chisel pauses on a granite edge, perfectly balanced."},{"kind":"line","player":false,"speaker":"MASON","text":"A sensible man doesn't put his hand where the stone is soft."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The stone wasn't soft. It was dry granite."},{"kind":"line","player":false,"speaker":"MASON","text":"Granite rots too, if you give it reasons.\nWe mend what holds boats. What sits beneath cellars isn't our trade."},{"id":"observer_pantry_refusal","kind":"notebook","text":"Harbor mason on grounds crew avoiding pantry: 'A sensible man doesn't put his hand where the stone is soft.'"},{"id":"observer_stone_discipline","kind":"evidence"}],"tag":"observer_estate_crew","timing":"5"},{"gate":{"args":["observer_stone_discipline"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"gate_src":"evidence(observer_stone_discipline)","id":"drowned_island","label":"Ask about the drowned island off the point","line":29,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Nobody takes dories out to the old whaling ruins anymore."},{"kind":"line","player":false,"speaker":"MASON","text":"Nothing out there to catch."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The try-works buildings are still standing above the mud."},{"kind":"line","player":false,"speaker":"MASON","text":"Standing isn't the same as welcoming."},{"kind":"beat","text":"He resumes chipping, steady, flat strikes without anger or haste."},{"kind":"line","player":false,"speaker":"MASON","text":"Our grandfathers learned in a single night what looking at that water costs.\nThose who came back couldn't tell the same story twice.\nThe insurance paid the big houses on the hill; the sea kept the men.\nWe leave the mud where it settled."},{"id":"observer_island_1","kind":"notebook","text":"Mason on the drowned island: 'Our grandfathers learned in a single night what looking at that water costs... We leave the mud where it settled.'"},{"id":"island_memory","kind":"evidence"}],"tag":"observer_island","timing":"5"},{"gate":{"left":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"},"op":"and","right":{"expr":{"args":["harbor_observer","the_ring"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"coat = plain AND NOT topic_done(harbor_observer, the_ring)","id":"the_ring","label":"Ask about the copper ring on his hand","line":43,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"That band on your finger. It's not brass."},{"kind":"beat","text":"The mason turns his hand slightly; the ring catches a reddish-brown gleam that seems to resist the grey fog."},{"kind":"line","player":false,"speaker":"MASON","text":"It's an anchor link beaten flat. Worn since my father's time."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"Why wear it?"},{"kind":"line","player":false,"speaker":"MASON","text":"To remind the eye what belongs to the daylight.\n\nYou ask a great many questions, Officer.\nYou should ask yourself sometime whether you're trying to solve this town or just trying to become the next thing it forgets."},{"id":"observer_ring_1","kind":"notebook","text":"The harbor laborers wear beaten anchor links to 'remind the eye what belongs to daylight.' Warned Walter against asking too far."},{"id":"observer_color_tell","kind":"evidence"}],"tag":"observer_ring","timing":""}]},"local_historian":{"color":"#27ae60","label":"Mr. Abernathy (Historian)","location":"business_district","schedule":{"evening":"museum","midday":"museum","morning":"museum","night":"upper_house_4"},"source":"dialogue/local_historian.dialogue","topics":[{"gate":{"left":{"expr":{"args":["local_historian","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"op":"and","right":{"args":[],"call":false,"cmp":"=","name":"coat","op":"cmp","value":"plain"}},"gate_src":"NOT topic_done(local_historian, default) AND coat = plain","id":"default","label":"","line":7,"steps":[{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"Admittance is ten cents, which supports the preservation of maritime relics."},{"kind":"beat","text":"The curator peers up from a vitrine filled with tarnished whale-oil lamps and baleen corsetry."},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"Mind the glass on the center case. The hinge is delicate and the county grant does not cover careless elbows."}],"tag":"historian_plain","timing":""},{"gate":{"expr":{"args":["local_historian","default"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"},"gate_src":"NOT topic_done(local_historian, default)","id":"default","label":"","line":14,"steps":[{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"Officer Corwin. If this is regarding the regrettable affair at the Ophion estate, the Historical Society has already prepared our condolence resolution."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"I'm looking for history, Mr. Abernathy, not condolences."},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"History is what survives grief, Officer. It is rarely in a hurry."}],"tag":"historian_badge","timing":""},{"gate":{"op":"lit","value":true},"gate_src":"always","id":"ship_origin","label":"Ask about the naming of the whaling ship Ophion","line":21,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The flagship Ophion. Who named her?"},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"Elias Pruitt, 1819. A gentleman of classical discernment, educated at Harvard College."},{"kind":"beat","text":"He taps a framed pen-and-ink rendering of the three-masted bark on the wood-paneled wall."},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"Ophion is a name from Greek mythology. Classical names were fashionable among the merchant families."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"A classical name for a commercial vessel."},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"A respectable classical flourish, Officer! It was fashionable among Federalist merchant families to bestow Greek and Roman names upon commercial ventures. Nothing more sinister than an educated man's literary vanity."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The club kept the name."},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"To honor their forebears' enterprise. That is the Society's account."},{"id":"historian_ophion_1","kind":"notebook","text":"Abernathy attributes the ship's name to Elias Pruitt's classical tastes in 1819. He says the club retained it to honor the owners' enterprise."},{"id":"ophion_myth_classical","kind":"evidence"}],"tag":"historian_ophion","timing":"7"},{"gate":{"left":{"args":["ophion_myth_classical"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"args":["club_talk"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null}},"gate_src":"evidence(ophion_myth_classical) AND evidence(club_talk)","id":"dr_fenn_library","label":"Ask what Dr. Fenn was researching in the archives","line":37,"steps":[{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"Aldous Fenn spent weeks in our basement folio collection two winters ago."},{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"What was he looking for?"},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"Pre-Colonial shoreline surveys. And translations of Aegean mystery rites.\nHe brought in a battered German volume on Near Eastern chthonic cults."},{"kind":"fork","options":[{"label":"Ask about the annotations.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask about the annotations."},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"He was manic with his pencil. Underlining passages about gods that were not slain, only 'displaced.'\nI told him he was reading modern occultist rubbish into straightforward Athenian allegory, but a wealthy doctor does not welcome correction from a curator."},{"id":"historian_fenn_annotations","kind":"notebook","text":"Fenn studied Aegean mystery rites, obsessively annotating passages regarding gods 'displaced rather than slain.'"},{"id":"displaced_god_doctrine","kind":"evidence"}]},{"label":"Ask what Fenn took from the collection.","steps":[{"kind":"line","player":true,"speaker":"WALTER CORWIN","text":"Ask what Fenn took from the collection."},{"kind":"line","player":false,"speaker":"MR. ABERNATHY","text":"A survey map drawn by the try-works overseer in 1822, showing subterranean drainage conduits beneath the kitchen bluff.\nHe never returned the plate. Claimed it was lost to damp."},{"id":"historian_fenn_map","kind":"notebook","text":"Dr. Fenn borrowed and never returned an 1822 survey showing underground drainage conduits beneath the estate's kitchen bluff."},{"id":"estate_conduit_map","kind":"evidence"}]}]}],"tag":"historian_fenn_books","timing":"6"},{"gate":{"left":{"left":{"args":["lay_lead"],"call":true,"cmp":"","name":"evidence","op":"cmp","value":null},"op":"and","right":{"args":["local_historian","crew_omission_followup"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null}},"op":"and","right":{"expr":{"args":["local_historian","the_free_crew"],"call":true,"cmp":"","name":"topic_done","op":"cmp","value":null},"op":"not"}},"gate_src":"evidence(lay_lead) AND topic_done(local_historian, crew_omission_followup) AND NOT topic_done(local_historian, the_free_crew)","id":"the_free_crew","label":"Ask about free Black whalemen aboard the 1823 voyage","line":55,"steps":[{"kind":"line","player":false,"speaker":"WALTER CORWIN","text":"The O
