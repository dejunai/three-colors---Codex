<rect x="210" y="190" width="390" height="104" rx="5" fill="#f5f1e6" stroke="#637568" stroke-width="2"/><text x="230" y="224" class="label">Upper residential ridge</text><text x="230" y="253" class="small">Climb, retaining walls, long views.</text><text x="230" y="276" class="small">The town lies below its windows.</text><rect x="920" y="188" width="355" height="104" rx="5" fill="#f5f1e6" stroke="#637568" stroke-width="2"/><text x="940" y="222" class="label">Estate / inland edge</text><text x="940" y="251" class="small">Existing destination retained.</text><text x="940" y="274" class="small">Exact road alignment provisional.</text><rect x="690" y="367" width="425" height="126" rx="5" fill="#f5f1e6" stroke="#637568" stroke-width="2"/><text x="710" y="401" class="label">Business district</text><text x="710" y="430" class="small">Schoolhouse · museum · shops above/below</text><text x="710" y="453" class="small">First visual reference street.</text><text x="710" y="476" class="small">Foot traffic toward Pickman and the quay.</text><rect x="330" y="457" width="340" height="126" rx="5" fill="#f5f1e6" stroke="#637568" stroke-width="2"/><text x="350" y="491" class="label">Pickman Street</text><text x="350" y="520" class="small">Boardinghouse · precinct · cobbler</text><text x="350" y="543" class="small">Butcher · existing civic frontage</text><text x="350" y="566" class="small">Post office as a daily meeting point.</text><rect x="125" y="618" width="340" height="104" rx="5" fill="#f5f1e6" stroke="#637568" stroke-width="2"/><text x="145" y="652" class="label">Lower residential quarter</text><text x="145" y="681" class="small">Doorsteps and shared spaces.</text><text x="145" y="704" class="small">Short route to waterfront work.</text><rect x="615" y="710" width="385" height="104" rx="5" fill="#f5f1e6" stroke="#637568" stroke-width="2"/><text x="635" y="744" class="label">Working waterfront — later</text><text x="635" y="773" class="small">Fish shed · repair yard · freight</text><text x="635" y="796" class="small">Ordinary errands face the shore.</text><path d="M1110 874 L1138 852 L1180 855 L1220 839 L1260 861 L1274 884 L1240 900 L1178 902 L1130 895Z" fill="#7e8676" stroke="#4f675a" stroke-width="2"/><path d="M1140 872 L1165 852 L1208 860 L1227 851 L1249 872Z" fill="#aba18a"/><text x="1055" y="944" class="label">Offshore island</text><text x="1055" y="970" class="small">Whaling station buried in mud.</text><text x="1055" y="995" class="small">No land route. Ward crosses in Chapter 2.</text><path d="M885 794 L1144 867" stroke="#9a8154" stroke-width="2" stroke-dasharray="3 10" marker-end="url(#arrow)"/><text x="795" y="878" class="note">Possible background sightline</text><text x="795" y="900" class="note">Visible, avoidable, unmarked in play.</text><rect x="55" y="850" width="665" height="144" rx="5" fill="#e9e5d7" stroke="#788475"/><text x="77" y="880" class="label">Design commitments</text><text x="77" y="910" class="small">Height expresses class; streets connect ordinary errands.</text><text x="77" y="937" class="small">Dashed routes are future connections, not new playable paths.</text><text x="77" y="964" class="small">Island placement and compass orientation remain provisional.</text></svg>