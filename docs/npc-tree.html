<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Colors of Madness — NPC Dialogue Tree</title>
<style>
:root {
  --bg: #0d0c0b;
  --surface: #141310;
  --surface2: #1a1816;
  --surface3: #211f1c;
  --border: #2e2b27;
  --text: #ccc9c2;
  --text-muted: #7a7770;
  --text-faint: #4a4845;
  --accent: #b08050;
  --accent-glow: #b08050aa;
  --plain-color: #5fa88a;
  --badge-color: #a85f5f;
  --evidence-color: #8888cc;
  --fork-color: #c9a03a;
  --gate-color: #6a9a6a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Georgia', serif; }

/* HEADER */
header {
  padding: 24px 32px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
header h1 { font-size: 1.1rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: normal; }
header p { font-size: 0.8rem; color: var(--text-muted); font-style: italic; margin-top: 4px; }

.legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-muted); }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.leg-badge { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

/* LAYOUT */
.wrapper { display: flex; height: calc(100vh - 80px); overflow: hidden; }

/* SIDEBAR */
.sidebar {
  width: 260px; min-width: 200px; flex-shrink: 0;
  overflow-y: auto; border-right: 1px solid var(--border);
  background: var(--surface);
  padding: 12px 0;
}
.sidebar::-webkit-scrollbar { width: 5px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.loc-group { margin-bottom: 4px; }
.loc-header {
  padding: 6px 16px; font-size: 0.68rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-faint);
  cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: space-between;
  transition: color 0.15s;
}
.loc-header:hover { color: var(--text-muted); }
.loc-header .arrow { transition: transform 0.2s; }
.loc-group.collapsed .arrow { transform: rotate(-90deg); }
.loc-group.collapsed .loc-npcs { display: none; }

.npc-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 16px 7px 24px; width: 100%; text-align: left;
  background: none; border: none; color: var(--text-muted);
  font-family: inherit; font-size: 0.82rem; cursor: pointer;
  transition: background 0.12s, color 0.12s;
  border-left: 2px solid transparent;
}
.npc-btn:hover { background: var(--surface2); color: var(--text); }
.npc-btn.active { background: var(--surface3); color: var(--text); border-left-color: var(--accent); }
.npc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.topic-count { margin-left: auto; font-size: 0.68rem; color: var(--text-faint); }

/* MAIN PANEL */
.main { flex: 1; overflow-y: auto; padding: 28px 36px; }
.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 60vh; gap: 12px; color: var(--text-faint);
  text-align: center;
}
.placeholder svg { opacity: 0.2; }
.placeholder p { font-size: 0.85rem; font-style: italic; max-width: 320px; line-height: 1.6; }

/* NPC HEADER */
.npc-header {
  display: flex; align-items: flex-start; gap: 16px;
  margin-bottom: 24px; padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.npc-color-bar { width: 4px; flex-shrink: 0; border-radius: 2px; align-self: stretch; min-height: 40px; }
.npc-title { font-size: 1.3rem; color: var(--text); letter-spacing: 0.04em; }
.npc-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; font-style: italic; }
.npc-id { font-size: 0.68rem; color: var(--text-faint); margin-top: 2px; letter-spacing: 0.08em; font-family: 'Courier New', monospace; }

/* TOPIC TREE */
.topic-tree { display: flex; flex-direction: column; gap: 10px; }

.topic-node {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
  transition: border-color 0.15s;
}
.topic-node:hover { border-color: #4a4640; }
.topic-node.has-evidence { border-left: 3px solid var(--evidence-color); }
.topic-node.has-fork { border-left: 3px solid var(--fork-color); }
.topic-node.coat-plain { border-left: 3px solid var(--plain-color); }
.topic-node.coat-badge { border-left: 3px solid var(--badge-color); }
.topic-node.never { opacity: 0.45; border-left: 3px solid var(--text-faint); }

.topic-head {
  padding: 10px 14px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; user-select: none;
}
.topic-name { font-size: 0.88rem; color: var(--text); flex: 1; }
.topic-tag { font-size: 0.68rem; color: var(--text-faint); font-family: 'Courier New', monospace; }
.topic-badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.pill {
  font-size: 0.62rem; padding: 2px 7px; border-radius: 3px;
  font-family: 'Courier New', monospace; letter-spacing: 0.04em; flex-shrink: 0;
}
.pill-plain { background: #1a3028; color: var(--plain-color); border: 1px solid #2a4a3a; }
.pill-badge { background: #301818; color: var(--badge-color); border: 1px solid #4a2828; }
.pill-evidence { background: #1a1a2e; color: var(--evidence-color); border: 1px solid #2a2a4e; }
.pill-gate { background: #1a2a1a; color: var(--gate-color); border: 1px solid #2a3a2a; }
.pill-fork { background: #2e2010; color: var(--fork-color); border: 1px solid #4a3818; }
.pill-never { background: #1a1a1a; color: var(--text-faint); border: 1px solid #2a2a2a; }
.pill-out { background: #1e1e30; color: #9999ee; border: 1px solid #2e2e50; }

.topic-body {
  padding: 0 14px 12px; display: none;
  border-top: 1px solid var(--border);
  font-size: 0.78rem; color: var(--text-muted); line-height: 1.7;
}
.topic-body.open { display: block; }
.topic-body .gate-text { font-style: italic; color: var(--text-faint); margin-bottom: 6px; font-size: 0.75rem; }
.topic-body .ev-label { font-size: 0.72rem; color: var(--evidence-color); margin-top: 8px; }
.ev-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

.toggle-arrow { font-size: 0.7rem; color: var(--text-faint); transition: transform 0.15s; }
.topic-head.open .toggle-arrow { transform: rotate(90deg); }

/* SECTION LABEL */
.section-label {
  font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-faint); margin: 20px 0 8px;
  padding-bottom: 4px; border-bottom: 1px solid var(--border);
}

/* ALL NPCs VIEW */
.all-npc-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px; margin-top: 8px;
}
.npc-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
  border-left: 3px solid transparent;
}
.npc-card:hover { border-color: #4a4640; background: var(--surface3); }
.npc-card-title { font-size: 0.88rem; color: var(--text); }
.npc-card-loc { font-size: 0.7rem; color: var(--text-faint); margin-top: 3px; font-style: italic; }
.npc-card-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; }

/* SEARCH */
.search-bar {
  padding: 8px 16px 0;
}
.search-bar input {
  width: 100%; padding: 6px 10px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-size: 0.78rem; font-family: inherit;
  outline: none;
}
.search-bar input::placeholder { color: var(--text-faint); }
.search-bar input:focus { border-color: var(--accent); }

/* STATS BAR */
.stats-bar {
  display: flex; gap: 20px; flex-wrap: wrap;
  padding: 14px 0 18px; font-size: 0.72rem; color: var(--text-muted);
}
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-n { font-size: 1rem; color: var(--text); }
</style>

const LOCATIONS = {
  "estate":                  { label: "The Estate",        color: "#9a3030" },
  "estate / lounge":         { label: "Estate / Lounge",   color: "#9a3030" },
  "boardinghouse":           { label: "Boardinghouse",     color: "#7a40a0" },
  "town":                    { label: "Town",               color: "#4060a0" },
  "business_district":       { label: "Business District", color: "#2a7050" },
  "town_hall":               { label: "Town Hall",         color: "#2a7050" },
  "post_office":             { label: "Post Office",       color: "#2a7050" },
  "lower_residential":       { label: "Lower Quarter",     color: "#3a5880" },
  "upper_residential_ridge": { label: "Upper Ridge",       color: "#a05830" },
  "upper_residential":       { label: "Upper Residential", color: "#a05830" },
};

// Group by location maintaining order
const LOC_ORDER = ["estate","estate / lounge","boardinghouse","town","business_district","town_hall","post_office","lower_residential","upper_residential_ridge","upper_residential"];
const byLoc = {};
LOC_ORDER.forEach(l => byLoc[l] = []);
Object.entries(NPCS).forEach(([id, npc]) => {
  if (!byLoc[npc.location]) byLoc[npc.location] = [];
  byLoc[npc.location].push(id);
});

let activeNpc = null;

function buildNav(filter = "") {
  const nav = document.getElementById("nav-tree");
  nav.innerHTML = "";
  LOC_ORDER.forEach(loc => {
    const ids = byLoc[loc] || [];
    const filtered = filter ? ids.filter(id => NPCS[id].label.toLowerCase().includes(filter.toLowerCase())) : ids;
    if (!filtered.length) return;
    const locInfo = LOCATIONS[loc] || { label: loc, color: "#888" };
    const grp = document.createElement("div");
    grp.className = "loc-group";
    grp.innerHTML = `<div class="loc-header" onclick="toggleLoc(this)">
      <span>${locInfo.label}</span><span class="arrow">▾</span>
    </div><div class="loc-npcs">` +
      filtered.map(id => {
        const npc = NPCS[id];
        const tc = npc.topics ? npc.topics.length : 0;
        return `<button class="npc-btn${activeNpc===id?' active':''}" onclick="showNpc('${id}')" data-id="${id}">
          <span class="npc-dot" style="background:${npc.color}"></span>
          <span>${npc.label}</span>
          <span class="topic-count">${tc}T</span>
        </button>`;
      }).join("") + `</div>`;
    nav.appendChild(grp);
  });
}

function toggleLoc(el) {
  el.parentElement.classList.toggle("collapsed");
}

function gateClass(gate) {
  if (!gate) return "";
  const g = gate.toLowerCase();
  if (g.includes("never")) return "never";
  if (g.includes("coat=plain") || g.includes("coat = plain")) return "coat-plain";
  if (g.includes("coat!=plain") || g.includes("coat≠plain") || g.includes("coat != plain")) return "coat-badge";
  if (g.includes("evidence(")) return "has-evidence";
  return "";
}

function gatePills(gate) {
  if (!gate) return "";
  const g = gate;
  const pills = [];
  if (g.toLowerCase().includes("never")) pills.push(`<span class="pill pill-never">NEVER</span>`);
  if (g.toLowerCase().includes("coat=plain") || g.toLowerCase().includes("coat = plain")) pills.push(`<span class="pill pill-plain">coat = plain</span>`);
  if (g.toLowerCase().includes("coat!=plain") || g.toLowerCase().includes("coat≠plain") || g.toLowerCase().includes("coat != plain")) pills.push(`<span class="pill pill-badge">coat ≠ plain</span>`);
  const evMatches = [...g.matchAll(/evidence\(([^)]+)\)/gi)];
  evMatches.forEach(m => pills.push(`<span class="pill pill-gate">need: ${m[1]}</span>`));
  if (g.toLowerCase().includes("always") && !pills.length) pills.push(`<span class="pill pill-gate">always</span>`);
  if (g.toLowerCase().includes("first visit") && !pills.some(p=>p.includes("always"))) pills.push(`<span class="pill pill-gate">first visit</span>`);
  return pills.join(" ");
}

function showNpc(id) {
  activeNpc = id;
  buildNav(document.getElementById("search").value);
  const npc = NPCS[id];
  const detail = document.getElementById("npc-detail");
  const locInfo = LOCATIONS[npc.location] || { label: npc.location, color: npc.color };

  const topics = npc.topics || [];
  const evidenceOut = [...new Set(topics.flatMap(t => t.evidence_out || []))];
  const forkCount = topics.filter(t => t.fork).length;
  const plainCount = topics.filter(t => t.gate && (t.gate.includes("coat=plain") || t.gate.includes("coat = plain"))).length;
  const badgeCount = topics.filter(t => t.gate && (t.gate.includes("coat!=plain") || t.gate.includes("coat !=") || t.gate.includes("coat≠"))).length;

  detail.innerHTML = `
    <div class="npc-header">
      <div class="npc-color-bar" style="background:${npc.color}"></div>
      <div>
        <div class="npc-title">${npc.label}</div>
        <div class="npc-meta">${locInfo.label}</div>
        <div class="npc-id">npc: ${id}</div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat"><span class="stat-n">${topics.length}</span>topics</div>
      <div class="stat"><span class="stat-n">${evidenceOut.length}</span>evidence out</div>
      <div class="stat"><span class="stat-n">${forkCount}</span>forks</div>
      <div class="stat"><span class="stat-n" style="color:#5fa88a">${plainCount}</span>plain-only</div>
      <div class="stat"><span class="stat-n" style="color:#a85f5f">${badgeCount}</span>badge-only</div>
    </div>

    <div class="section-label">Topics</div>
    <div class="topic-tree">
      ${topics.map((t, i) => {
        const gc = gateClass(t.gate);
        const evOut = (t.evidence_out || []);
        return `<div class="topic-node ${gc}${t.fork ? " has-fork" : ""}${gc === "never" ? " never" : ""}">
          <div class="topic-head" onclick="toggleTopic(this)">
            <span class="toggle-arrow">▶</span>
            <span class="topic-name">${t.label || t.id}</span>
            <div class="topic-badges">
              ${gatePills(t.gate)}
              ${t.fork ? '<span class="pill pill-fork">fork</span>' : ""}
              ${evOut.map(e => `<span class="pill pill-out">→ ${e}</span>`).join("")}
            </div>
          </div>
          <div class="topic-body">
            <div class="gate-text">Gate: ${t.gate || "—"}</div>
            ${t.id !== t.label ? `<div class="gate-text" style="margin-bottom:0">ID: <code>${t.id}</code></div>` : ""}
            ${evOut.length ? `<div class="ev-label">Evidence produced:</div><div class="ev-list">${evOut.map(e=>`<span class="pill pill-out">${e}</span>`).join("")}</div>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>
  `;

  document.getElementById("placeholder").style.display = "none";
  detail.style.display = "block";
}

function toggleTopic(el) {
  el.classList.toggle("open");
  const body = el.nextElementSibling;
  body.classList.toggle("open");
}

document.getElementById("search").addEventListener("input", e => {
  buildNav(e.target.value);
});

buildNav();
</script>
